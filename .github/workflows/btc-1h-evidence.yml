name: BTC 1h prospective evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-1h-evidence.yml
      - btc-1h-heartbeat.txt
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-1h-prospective-evidence
  cancel-in-progress: false

jobs:
  collect-sign-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out 1h evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-1h
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Configure evidence identity
        shell: bash
        run: |
          git config user.name 'btc-1h-evidence[bot]'
          git config user.email 'btc-1h-evidence[bot]@users.noreply.github.com'
      - name: Run preregistered 1h prospective worker
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime1h/worker.py
