name: BTC arbitration v3 continuous wakeup

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-arbitration-v3-continuous-wakeup.yml]
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: btc-arbitration-v3-continuous-wakeup
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Keep the source sequencer awake before each deadline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json,os,time,urllib.request

          repo=os.environ['REPO_NAME']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json','Content-Type':'application/json',
                   'User-Agent':'btc-arbitration-v3-continuous-wakeup'}
          def dispatch(target):
              url=f"https://api.github.com/repos/{repo}/actions/workflows/{target}/dispatches"
              body=json.dumps({'ref':'main'}).encode()
              req=urllib.request.Request(url,data=body,method='POST',headers=headers)
              with urllib.request.urlopen(req,timeout=25) as response:
                  if response.status!=204:raise RuntimeError(f"{target}: HTTP {response.status}")

          target='btc-arbitration-v3-sequencer.yml'
          stages=(2,12,22,32,39)
          sent=set()
          stop=time.monotonic()+330*60
          while time.monotonic()<stop:
              now=dt.datetime.now(dt.timezone.utc)
              eligible=[stage for stage in stages if stage<=now.minute]
              if now.minute<43 and eligible:
                  key=(now.strftime('%Y%m%dT%H'),max(eligible))
                  if key not in sent:
                      try:
                          dispatch(target)
                          sent.add(key)
                          print(now.isoformat(),'DISPATCH',target,key,flush=True)
                      except Exception as error:
                          print(now.isoformat(),'ERROR',target,key,repr(error),flush=True)
              if len(sent)>150:
                  day=now.strftime('%Y%m%d')
                  sent={key for key in sent if key[0].startswith(day)}
              time.sleep(45)

          # Queue one successor before this runner reaches its six-hour limit.
          for attempt in range(20):
              try:
                  dispatch('btc-arbitration-v3-continuous-wakeup.yml')
                  print(dt.datetime.now(dt.timezone.utc).isoformat(),'SUCCESSOR_QUEUED',flush=True)
                  break
              except Exception as error:
                  print(dt.datetime.now(dt.timezone.utc).isoformat(),
                        'SUCCESSOR_ERROR',attempt,repr(error),flush=True)
                  time.sleep(45)
          else:
              raise RuntimeError('successor dispatch failed after retries')
          PY
