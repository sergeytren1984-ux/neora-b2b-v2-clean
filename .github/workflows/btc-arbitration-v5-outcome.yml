name: BTC arbitration v5 due outcomes

on:
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-arbitration-v5-ledger
  cancel-in-progress: false

jobs:
  signed-outcome:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-arbitration-v5
          fetch-depth: 0
          persist-credentials: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Configure signed event author
        run: |
          git config user.name 'btc-arbitration-v5[bot]'
          git config user.email 'btc-arbitration-v5[bot]@users.noreply.github.com'
      - name: Frozen arbiter selftest
        run: python3 arbiter_v5/selftest.py
      - name: Verify due sources and publish one outcome
        run: python3 arbiter_v5/worker.py
        env:
          BTC_ARBITER_MODE: outcome
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
