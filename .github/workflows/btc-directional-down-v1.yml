name: BTC downside 4h shadow v1

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-directional-down-v1.yml]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-directional-down-v1
  cancel-in-progress: false

jobs:
  prospective-alert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-directional-down-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Configure signed event author
        run: |
          git config user.name 'btc-directional-down-v1[bot]'
          git config user.email 'btc-directional-down-v1[bot]@users.noreply.github.com'
      - name: Frozen model selftest
        run: python3 directional_down_v1/selftest.py
      - name: Prospective worker
        run: python3 directional_down_v1/worker.py

