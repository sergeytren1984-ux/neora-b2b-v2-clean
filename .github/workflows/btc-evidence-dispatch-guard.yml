name: BTC evidence dispatch guard

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-evidence-dispatch-guard.yml]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-evidence-dispatch-guard
  cancel-in-progress: false

jobs:
  continuous-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep evidence workflows alive independently of GitHub cron delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "User-Agent": "btc-evidence-continuous-dispatch-guard",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def dispatch(workflow):
              url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
              body = json.dumps({"ref": "main"}).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=20) as r:
                  if r.status != 204:
                      raise RuntimeError(f"dispatch {workflow}: HTTP {r.status}")
              print(dt.datetime.now(dt.timezone.utc).isoformat(),
                    "DISPATCH", workflow, flush=True)

          # The signed workers themselves enforce idempotency, registered deadlines,
          # due-time semantics and no-backfill. This guard only supplies reliable wakeups.
          one_h_stages = (1, 6, 11, 16)       # all before registered +20m deadline
          four_h_stages = (2, 12, 22, 32)     # all before registered +45m deadline
          context_stages = (0, 30)             # refresh context at least twice per hour
          sent = set()
          stop = time.monotonic() + 95 * 60

          while time.monotonic() < stop:
              now = dt.datetime.now(dt.timezone.utc)
              hour_key = now.strftime("%Y%m%dT%H")
              minute = now.minute

              if minute < 20:
                  eligible = [s for s in one_h_stages if s <= minute]
                  if eligible:
                      stage = max(eligible)
                      key = ("1h", hour_key, stage)
                      if key not in sent:
                          try:
                              dispatch("btc-1h-evidence-v2.yml")
                              dispatch("btc-1h-evidence-v3.yml")
                              dispatch("btc-regime-v2-audit.yml")
                              sent.add(key)
                          except Exception as e:
                              print(now.isoformat(), "ERROR", key, repr(e), flush=True)

              if now.hour % 4 == 0 and minute < 40:
                  eligible = [s for s in four_h_stages if s <= minute]
                  if eligible:
                      stage = max(eligible)
                      key = ("4h", hour_key, stage)
                      if key not in sent:
                          try:
                              dispatch("btc-prospective-evidence.yml")
                              dispatch("btc-prospective-evidence-v4.yml")
                              dispatch("btc-prospective-evidence-v5.yml")
                              sent.add(key)
                          except Exception as e:
                              print(now.isoformat(), "ERROR", key, repr(e), flush=True)

              eligible = [s for s in context_stages if s <= minute]
              if eligible:
                  stage = max(eligible)
                  key = ("context", hour_key, stage)
                  if key not in sent:
                      try:
                          dispatch("btc-context-evidence.yml")
                          sent.add(key)
                      except Exception as e:
                          print(now.isoformat(), "ERROR", key, repr(e), flush=True)

              # Keep memory bounded over long-lived/self-chained runs.
              if len(sent) > 200:
                  current_day = now.strftime("%Y%m%d")
                  sent = {k for k in sent if current_day in k[1]}

              time.sleep(45)

          # Hand off before the job timeout; the hourly heartbeat is an independent fallback.
          try:
              dispatch("btc-evidence-dispatch-guard.yml")
          except Exception as e:
              print(dt.datetime.now(dt.timezone.utc).isoformat(),
                    "ERROR self-dispatch", repr(e), flush=True)
              raise
          PY
