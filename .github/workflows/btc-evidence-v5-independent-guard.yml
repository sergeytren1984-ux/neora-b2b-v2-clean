name: BTC epoch 5 independent slot guard

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-evidence-v5-independent-guard.yml]
  schedule:
    - cron: '8,18,28,38 0,4,8,12,16,20 * * *'
  workflow_run:
    workflows: ['BTC context evidence']
    types: [completed]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-evidence-v5-independent-guard
  cancel-in-progress: false

jobs:
  dispatch-eligible:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reinvoke immutable epoch 5 worker before deadline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          import json,os,urllib.request
          now=datetime.now(timezone.utc)
          if now.hour%4 or now.minute>=41:
              print('No eligible issuance window at',now.isoformat())
              raise SystemExit(0)
          url=f"https://api.github.com/repos/{os.environ['REPO_NAME']}/actions/workflows/btc-prospective-evidence-v5.yml/dispatches"
          req=urllib.request.Request(url,data=json.dumps({'ref':'main'}).encode(),method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
              'Content-Type':'application/json','User-Agent':'btc-evidence-v5-independent-guard'})
          with urllib.request.urlopen(req,timeout=25) as response:
              if response.status!=204:raise RuntimeError('dispatch failed '+str(response.status))
          print('Dispatched immutable epoch 5 worker',now.isoformat())
          PY
