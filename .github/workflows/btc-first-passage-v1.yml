name: BTC fixed barrier evidence v1

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-first-passage-v1.yml]
  schedule:
    - cron: '7,17,27,37 14 * * *'
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-fixed-barrier-evidence-v1
  cancel-in-progress: false

jobs:
  signed-question-and-outcome:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-first-passage-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Configure signed evidence author
        run: |
          git config user.name 'btc-first-passage-v1[bot]'
          git config user.email 'btc-first-passage-v1[bot]@users.noreply.github.com'
      - name: Frozen first passage selftest
        run: python3 first_passage_v1/selftest.py
      - name: Publish signed fixed question and due-only outcome
        run: python3 first_passage_v1/worker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
