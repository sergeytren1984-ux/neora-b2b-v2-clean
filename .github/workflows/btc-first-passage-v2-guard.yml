name: BTC fixed barrier independent wakeup

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-first-passage-v2-guard.yml]
  schedule:
    - cron: '9,24,39 14 * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake frozen barrier ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO_NAME']}/actions/workflows/btc-first-passage-v2.yml/dispatches"
          req=urllib.request.Request(url,data=json.dumps({'ref':'main'}).encode(),method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'User-Agent':'btc-first-passage-v2-guard'})
          with urllib.request.urlopen(req,timeout=25) as response:
              if response.status!=204:raise RuntimeError('barrier ledger dispatch failed')
          PY
