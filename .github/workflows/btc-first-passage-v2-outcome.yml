name: BTC fixed barrier due outcome v2

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-fixed-barrier-ledger-v2
  cancel-in-progress: false

jobs:
  signed-outcome:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-first-passage-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Configure signed evidence author
        run: |
          git config user.name 'btc-first-passage-v2[bot]'
          git config user.email 'btc-first-passage-v2[bot]@users.noreply.github.com'
      - name: Frozen first passage selftest
        run: python3 first_passage_v2/selftest.py
      - name: Publish due-only signed barrier outcome
        run: python3 first_passage_v2/worker.py
        env:
          BTC_BARRIER_MODE: outcome
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
