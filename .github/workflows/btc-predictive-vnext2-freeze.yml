name: BTC predictive vNext2 freeze candidates

on:
  push:
    branches: [btc-predictive-vnext-sol-20261004]
    paths:
      - research_vnext2/freeze_candidates.py
      - .github/workflows/btc-predictive-vnext2-freeze.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-predictive-vnext2-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext-sol-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - run: python research_vnext/fetch_hourly.py
      - run: python research_vnext/fetch_micro.py
      - run: python -m unittest discover -s research_vnext2 -p 'test_*.py' -v
      - run: python research_vnext2/freeze_candidates.py
      - name: Commit frozen candidate artifacts
        run: |
          git config user.name 'btc-predictive-vnext2[bot]'
          git config user.email 'btc-predictive-vnext2[bot]@users.noreply.github.com'
          git add predictive_vnext2/hourly_rv72_competing_risks.joblib
          git add predictive_vnext2/early15m_pm1_4h_competing_risks.joblib
          git add predictive_vnext2/freeze_metadata.json
          git commit -m "Freeze vNext2 prospective shadow artifacts"
          git push origin HEAD:btc-predictive-vnext-sol-20261004
