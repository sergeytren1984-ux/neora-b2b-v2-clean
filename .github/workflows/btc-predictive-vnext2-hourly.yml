name: BTC predictive vNext2 hourly shadow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext2-hourly.yml
  schedule:
    - cron: '8,23,38 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-predictive-vnext2-hourly-ledger
  cancel-in-progress: false

jobs:
  signed-forecast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext2-hourly
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Configure signed evidence author
        run: |
          git config user.name 'btc-predictive-vnext2-hourly[bot]'
          git config user.email 'btc-predictive-vnext2-hourly[bot]@users.noreply.github.com'
      - name: Production parity selftest
        env:
          PYTHONPATH: .
        run: python predictive_vnext2/selftest.py
      - name: Publish signed hourly shadow forecast
        env:
          PYTHONPATH: .
          BTC_VNEXT2_HEAD: hourly
          BTC_VNEXT2_ACTION: forecast
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python predictive_vnext2/worker.py
