name: BTC predictive vNext2 research

on:
  push:
    branches: [btc-predictive-vnext-sol-20261004]
    paths:
      - research_vnext2/core.py
      - research_vnext2/run_hourly.py
      - research_vnext2/run_early15m.py
      - research_vnext2/test_vnext2.py
      - .github/workflows/btc-predictive-vnext2-research.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-predictive-vnext2-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext-sol-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2
      - name: Recreate verified hourly source
        run: python research_vnext/fetch_hourly.py
      - name: Recreate verified 5m and 15m sources
        run: python research_vnext/fetch_micro.py
      - name: Run causal invariant tests
        run: python -m unittest discover -s research_vnext2 -p 'test_*.py' -v
      - name: Run hourly anchor benchmark
        run: python research_vnext2/run_hourly.py
      - name: Run 15m early-warning benchmark
        run: python research_vnext2/run_early15m.py
      - name: Commit reproducible research outputs
        run: |
          git config user.name 'btc-predictive-vnext2[bot]'
          git config user.email 'btc-predictive-vnext2[bot]@users.noreply.github.com'
          git add research_vnext2/hourly_result.json research_vnext2/early15m_result.json
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Record predictive vNext2 research outputs [research-output]"
          git push origin HEAD:btc-predictive-vnext-sol-20261004
