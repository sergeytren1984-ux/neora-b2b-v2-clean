name: BTC predictive vNext3 independent prestart audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext3-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: hourly
            branch: btc-predictive-vnext3-hourly
          - head: early15m
            branch: btc-predictive-vnext3-early15m
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Verify signed freeze, Rekor and workflow provenance
        env:
          PYTHONPATH: .
        run: |
          python predictive_vnext3/scorecard.py --head ${{ matrix.head }} > /tmp/score.json
          cat /tmp/score.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/score.json'))
          assert x['governance']['ok'] is True, x['governance']
          assert x['governance']['cosign_rekor_verified_events'] >= 2
          assert x['score']['status'] == 'PENDING_NO_CLOSED_OUTCOMES'
          print('PRESTART_GOVERNANCE_ACCEPT')
          PY
