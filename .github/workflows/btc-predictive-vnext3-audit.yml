name: BTC predictive vNext3 independent prestart audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext3-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: hourly
            branch: btc-predictive-vnext3-hourly
          - head: early15m
            branch: btc-predictive-vnext3-early15m
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Verify signed freeze, Rekor and workflow provenance
        env:
          PYTHONPATH: .
        run: |
          python predictive_vnext3/scorecard.py --head ${{ matrix.head }} > /tmp/score.json
          cat /tmp/score.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/score.json'))
          assert x['governance']['ok'] is True, x['governance']
          assert x['governance']['cosign_rekor_verified_events'] >= 2
          assert x['score']['status'] == 'PENDING_NO_CLOSED_OUTCOMES'
          print('PRESTART_GOVERNANCE_ACCEPT')
          PY
      - name: Exercise runtime freeze gate and tamper rejection
        env:
          PYTHONPATH: .
          BTC_VNEXT3_SOURCE_SHA: 9ee30cb618a505976ddd143876718f969b307c67
        run: |
          HEAD='${{ matrix.head }}'
          if [ "$HEAD" = "hourly" ]; then
            FW='.github/workflows/btc-predictive-vnext3-hourly.yml'
            OW='.github/workflows/btc-predictive-vnext3-hourly-outcome.yml'
          else
            FW='.github/workflows/btc-predictive-vnext3-early15m.yml'
            OW='.github/workflows/btc-predictive-vnext3-early15m-outcome.yml'
          fi
          HEAD_FOR_TEST="$HEAD" BTC_VNEXT3_WORKFLOW_PATH="$FW" python - <<'PY'
          import os
          from predictive_vnext3.worker import CONFIG, verify_signed_freeze
          head=os.environ['HEAD_FOR_TEST']
          verify_signed_freeze(CONFIG[head],head,'forecast')
          print('RUNTIME_FORECAST_FREEZE_GATE_ACCEPT')
          PY
          HEAD_FOR_TEST="$HEAD" BTC_VNEXT3_WORKFLOW_PATH="$OW" python - <<'PY'
          import os
          from predictive_vnext3.worker import CONFIG, verify_signed_freeze
          head=os.environ['HEAD_FOR_TEST']
          verify_signed_freeze(CONFIG[head],head,'outcome')
          print('RUNTIME_OUTCOME_FREEZE_GATE_ACCEPT')
          PY
          printf '\n# intentional audit tamper\n' >> predictive_vnext3/predict.py
          set +e
          HEAD_FOR_TEST="$HEAD" BTC_VNEXT3_WORKFLOW_PATH="$FW" python - <<'PY'
          import os
          from predictive_vnext3.worker import CONFIG, verify_signed_freeze
          head=os.environ['HEAD_FOR_TEST']
          try:
              verify_signed_freeze(CONFIG[head],head,'forecast')
          except RuntimeError as ex:
              print('EXPECTED_TAMPER_REJECTION:', ex)
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          RC=$?
          set -e
          test "$RC" -eq 0
