name: BTC predictive vNext3 freeze contenders
# final contender freeze after audit-remediation code landed

on:
  push:
    branches: [btc-predictive-vnext3-source-20261004]
    paths:
      - research_vnext3/freeze_contenders.py
      - .github/workflows/btc-predictive-vnext3-freeze.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-predictive-vnext3-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext3-source-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - run: python research_vnext/fetch_hourly.py
      - run: python research_vnext/fetch_micro.py
      - run: python -m unittest discover -s research_vnext2 -p 'test_*.py' -v
      - name: Freeze contender bundle and baseline seed
        env:
          PYTHONPATH: .
        run: python research_vnext3/freeze_contenders.py
      - name: Commit frozen artifacts
        run: |
          git config user.name 'btc-predictive-vnext3[bot]'
          git config user.email 'btc-predictive-vnext3[bot]@users.noreply.github.com'
          git add predictive_vnext3/hourly_contenders.joblib
          git add predictive_vnext3/early15m_contenders.joblib
          git add predictive_vnext3/freeze_metadata.json
          git commit -m "Freeze vNext3 contenders and adaptive baseline seed"
          git push origin HEAD:btc-predictive-vnext3-source-20261004
