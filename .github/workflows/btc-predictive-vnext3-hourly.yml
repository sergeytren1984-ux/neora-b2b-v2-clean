name: BTC predictive vNext3 hourly shadow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext3-hourly.yml
  schedule:
    - cron: '8,23,38 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-predictive-vnext3-hourly-ledger
  cancel-in-progress: false

jobs:
  signed-forecast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext3-hourly
          fetch-depth: 0
          persist-credentials: true
      - name: Restore immutable vNext3 source
        run: |
          git checkout 9ee30cb618a505976ddd143876718f969b307c67 --             predictive_vnext3/worker.py             predictive_vnext3/live_features.py             predictive_vnext3/predict.py             predictive_vnext3/selftest.py             predictive_vnext3/scorecard.py             predictive_vnext3/freeze_metadata.json             predictive_vnext3/protocol_hourly.json             predictive_vnext3/hourly_contenders.joblib             research_vnext2/core.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Configure evidence author
        run: |
          git config user.name 'btc-predictive-vnext3-hourly[bot]'
          git config user.email 'btc-predictive-vnext3-hourly[bot]@users.noreply.github.com'
      - name: Production selftest
        env:
          PYTHONPATH: .
        run: python predictive_vnext3/selftest.py
      - name: Publish signed hourly shadow forecast
        env:
          PYTHONPATH: .
          BTC_VNEXT3_HEAD: hourly
          BTC_VNEXT3_ACTION: forecast
          BTC_VNEXT3_SOURCE_SHA: 9ee30cb618a505976ddd143876718f969b307c67
          BTC_VNEXT3_WORKFLOW_PATH: .github/workflows/btc-predictive-vnext3-hourly.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python predictive_vnext3/worker.py
