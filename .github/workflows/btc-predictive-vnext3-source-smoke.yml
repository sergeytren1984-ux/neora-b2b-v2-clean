name: BTC predictive vNext3 source smoke

on:
  push:
    branches: [btc-predictive-vnext3-source-20261004]
    paths:
      - predictive_vnext3/**
      - research_vnext2/core.py
      - .github/workflows/btc-predictive-vnext3-source-smoke.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext3-source-20261004
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Compile runtime
        run: python -m py_compile predictive_vnext3/worker.py predictive_vnext3/live_features.py predictive_vnext3/predict.py predictive_vnext3/scorecard.py
      - name: Run vNext3 selftest
        env:
          PYTHONPATH: .
        run: python predictive_vnext3/selftest.py
