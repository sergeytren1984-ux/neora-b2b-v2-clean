name: BTC predictive vNext4 freeze contenders

on:
  push:
    branches: [btc-predictive-vnext4-source-20261004]
    paths:
      - research_vnext4/freeze_contenders.py
      - predictive_vnext4/core.py
      - predictive_vnext4/live_features.py
      - predictive_vnext4/predict.py
      - .github/workflows/btc-predictive-vnext4-freeze.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-predictive-vnext4-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4-source-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - run: python research_vnext/fetch_hourly.py
      - run: python research_vnext/fetch_micro.py
      - name: Freeze vNext4 contender bundle and raw seed sources
        env:
          PYTHONPATH: .
        run: python research_vnext4/freeze_contenders.py
      - name: Commit frozen vNext4 artifacts
        run: |
          git config user.name 'btc-predictive-vnext4[bot]'
          git config user.email 'btc-predictive-vnext4[bot]@users.noreply.github.com'
          git add predictive_vnext4/hourly_contenders.joblib
          git add predictive_vnext4/early15m_contenders.joblib
          git add predictive_vnext4/baseline_seed_hourly_source.json.gz
          git add predictive_vnext4/baseline_seed_early15m_source.json.gz
          git add predictive_vnext4/freeze_metadata.json
          git commit -m "Freeze vNext4 contenders and reproducible baseline seed sources"
          git push origin HEAD:btc-predictive-vnext4-source-20261004
