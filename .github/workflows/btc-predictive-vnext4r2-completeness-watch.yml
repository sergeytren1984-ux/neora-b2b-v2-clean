name: BTC predictive vNext4R2 completeness watch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext4r2-completeness-watch.yml
  schedule:
    - cron: '40 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  completeness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: hourly
            branch: btc-predictive-vnext4r2-hourly
          - head: early15m
            branch: btc-predictive-vnext4r2-early15m
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Build immutable scorecard runtime
        run: |
          rm -rf /tmp/vnext4r2-runtime
          mkdir -p /tmp/vnext4r2-runtime
          git archive f0d18372271d33e762c4e8f042242eeb61c5cd35 | tar -x -C /tmp/vnext4r2-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Evaluate governance and due-grid completeness
        env:
          BTC_VNEXT4R2_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I /tmp/vnext4r2-runtime/predictive_vnext4r2/scorecard.py --head ${{ matrix.head }} --repo-root "$GITHUB_WORKSPACE" > /tmp/score.json
          cat /tmp/score.json
          python -c "import json; x=json.load(open('/tmp/score.json')); assert x['governance']['ok'] is True, x['governance']; s=x['score']; assert s['admission_ready'] is False or s['outcome_completeness']['complete'] is True"
