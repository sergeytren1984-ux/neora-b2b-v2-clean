name: BTC predictive vNext4R2 hourly outcomes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext4r2-hourly-outcome.yml
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-predictive-vnext4r2-hourly-ledger
  cancel-in-progress: false

jobs:
  due-outcomes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r2-hourly
          fetch-depth: 0
          persist-credentials: true
      - name: Build clean immutable runtime
        run: |
          rm -rf /tmp/vnext4r2-runtime
          mkdir -p /tmp/vnext4r2-runtime
          git archive f0d18372271d33e762c4e8f042242eeb61c5cd35 | tar -x -C /tmp/vnext4r2-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Configure evidence author
        run: |
          git config user.name 'btc-predictive-vnext4r2-hourly[bot]'
          git config user.email 'btc-predictive-vnext4r2-hourly[bot]@users.noreply.github.com'
      - name: Immutable runtime selftest
        run: python -I /tmp/vnext4r2-runtime/predictive_vnext4/selftest.py
      - name: Resolve due-only hourly outcomes
        env:
          BTC_VNEXT4R2_HEAD: hourly
          BTC_VNEXT4R2_ACTION: outcome
          BTC_VNEXT4R2_SOURCE_SHA: f0d18372271d33e762c4e8f042242eeb61c5cd35
          BTC_VNEXT4R2_WORKFLOW_PATH: .github/workflows/btc-predictive-vnext4r2-hourly-outcome.yml
          BTC_VNEXT4R2_EVIDENCE_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I /tmp/vnext4r2-runtime/predictive_vnext4r2/worker.py
