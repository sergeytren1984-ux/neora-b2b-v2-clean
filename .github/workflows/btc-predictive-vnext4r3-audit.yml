name: BTC predictive vNext4R3 independent prestart audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext4r3-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: hourly
            branch: btc-predictive-vnext4r3-hourly
            workflow: .github/workflows/btc-predictive-vnext4r3-hourly.yml
          - head: early15m
            branch: btc-predictive-vnext4r3-early15m
            workflow: .github/workflows/btc-predictive-vnext4r3-early15m.yml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Build clean immutable runtime
        run: |
          rm -rf /tmp/vnext4r3-runtime
          mkdir -p /tmp/vnext4r3-runtime
          git archive 0447c1c307956a98f7355541d5ba1d29fb5e9aea | tar -x -C /tmp/vnext4r3-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Verify signed prestart ledger and immutable governance
        env:
          BTC_VNEXT4R3_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I /tmp/vnext4r3-runtime/predictive_vnext4r3/scorecard.py             --head ${{ matrix.head }} --repo-root "$GITHUB_WORKSPACE" > /tmp/r3-score.json
          cat /tmp/r3-score.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r3-score.json'))
          assert x['governance']['ok'] is True, x['governance']
          assert x['governance']['source_commit_sha']=='0447c1c307956a98f7355541d5ba1d29fb5e9aea'
          assert x['governance']['cosign_rekor_verified_events']==2
          assert x['score']['status']=='PENDING_NO_DUE_INDEPENDENT_WINDOWS'
          assert x['score']['admission_ready'] is False
          print('R3_SIGNED_PRESTART_ACCEPT')
          PY
      - name: Re-run all admission and scheduler attack regressions
        run: |
          python -I /tmp/vnext4r3-runtime/predictive_vnext4r3/test_scorecard.py -v
          python -I /tmp/vnext4r3-runtime/predictive_vnext4r3/test_scheduler.py -v
          python -I /tmp/vnext4r3-runtime/predictive_vnext4r3/test_scheduler_stress.py -v
      - name: Verify production freeze gate for unified workflow
        env:
          BTC_VNEXT4R3_HEAD: ${{ matrix.head }}
          BTC_VNEXT4R3_ACTION: forecast
          BTC_VNEXT4R3_SOURCE_SHA: 0447c1c307956a98f7355541d5ba1d29fb5e9aea
          BTC_VNEXT4R3_WORKFLOW_PATH: ${{ matrix.workflow }}
          BTC_VNEXT4R3_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I - <<'PY'
          import os,sys
          sys.path.insert(0,'/tmp/vnext4r3-runtime')
          from predictive_vnext4r3.worker import CONFIG,verify_signed_freeze
          h=os.environ['BTC_VNEXT4R3_HEAD']
          verify_signed_freeze(CONFIG[h],h,'forecast')
          verify_signed_freeze(CONFIG[h],h,'outcome')
          print('R3_UNIFIED_FREEZE_GATE_ACCEPT')
          PY
      - name: Prove frozen scheduler tamper is rejected
        env:
          BTC_VNEXT4R3_HEAD: ${{ matrix.head }}
          BTC_VNEXT4R3_ACTION: forecast
          BTC_VNEXT4R3_SOURCE_SHA: 0447c1c307956a98f7355541d5ba1d29fb5e9aea
          BTC_VNEXT4R3_WORKFLOW_PATH: ${{ matrix.workflow }}
          BTC_VNEXT4R3_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          cp /tmp/vnext4r3-runtime/predictive_vnext4r3/scheduler.py /tmp/scheduler.clean
          printf '\n# adversarial mutation\n' >> /tmp/vnext4r3-runtime/predictive_vnext4r3/scheduler.py
          set +e
          python -I - <<'PY'
          import os,sys
          sys.path.insert(0,'/tmp/vnext4r3-runtime')
          from predictive_vnext4r3.worker import CONFIG,verify_signed_freeze
          h=os.environ['BTC_VNEXT4R3_HEAD']
          verify_signed_freeze(CONFIG[h],h,'forecast')
          PY
          rc=$?
          set -e
          test "$rc" -ne 0
          mv /tmp/scheduler.clean /tmp/vnext4r3-runtime/predictive_vnext4r3/scheduler.py
          echo "R3_TAMPER_REJECTED"
