name: BTC predictive vNext4R3 15m unified chain

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: btc-predictive-vnext4r3-early15m-unified-chain
  cancel-in-progress: false

jobs:
  unified-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r3-early15m
          fetch-depth: 0
          persist-credentials: true
      - name: Build clean immutable runtime
        run: |
          rm -rf /tmp/vnext4r3-runtime
          mkdir -p /tmp/vnext4r3-runtime
          git archive 0447c1c307956a98f7355541d5ba1d29fb5e9aea | tar -x -C /tmp/vnext4r3-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Configure evidence author
        run: |
          git config user.name 'btc-predictive-vnext4r3-early15m[bot]'
          git config user.email 'btc-predictive-vnext4r3-early15m[bot]@users.noreply.github.com'
      - name: Immutable numerical selftest
        run: python -I /tmp/vnext4r3-runtime/predictive_vnext4/selftest.py
      - name: Scheduler preflight
        env:
          BTC_VNEXT4R3_HEAD: early15m
          BTC_VNEXT4R3_PREFLIGHT: '1'
        run: python -I /tmp/vnext4r3-runtime/predictive_vnext4r3/scheduler.py
      - name: Pre-start signed registration and freeze
        env:
          BTC_VNEXT4R3_HEAD: early15m
          BTC_VNEXT4R3_ACTION: forecast
          BTC_VNEXT4R3_SOURCE_SHA: 0447c1c307956a98f7355541d5ba1d29fb5e9aea
          BTC_VNEXT4R3_WORKFLOW_PATH: .github/workflows/btc-predictive-vnext4r3-early15m.yml
          BTC_VNEXT4R3_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I - <<'PY'
          import sys
          sys.path.insert(0,"/tmp/vnext4r3-runtime")
          from predictive_vnext4r3.worker import START,utcnow,main
          if utcnow() < START:
              main()
              print("PRESTART_REGISTRATION_VERIFIED")
          else:
              print("POSTSTART_SKIP_REGISTRATION_STEP")
          PY
      - name: Queue successor before long session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY='{"ref":"main"}'
          for n in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/btc-predictive-vnext4r3-early15m.yml/dispatches"               -d "$BODY" || true)
            if [ "$code" = "204" ]; then
              echo "SUCCESSOR_QUEUED attempt=$n"
              exit 0
            fi
            cat /tmp/dispatch.out || true
            sleep $((n*2))
          done
          echo "SUCCESSOR_QUEUE_FAILED"
          exit 1
      - name: Run unified forecast and due-outcome session
        env:
          BTC_VNEXT4R3_HEAD: early15m
          BTC_VNEXT4R3_SOURCE_SHA: 0447c1c307956a98f7355541d5ba1d29fb5e9aea
          BTC_VNEXT4R3_WORKFLOW_PATH: .github/workflows/btc-predictive-vnext4r3-early15m.yml
          BTC_VNEXT4R3_EVIDENCE_ROOT: ${{ github.workspace }}
        run: python -I /tmp/vnext4r3-runtime/predictive_vnext4r3/scheduler.py
