name: BTC predictive vNext4R3 remediation candidate tests

on:
  push:
    branches:
      - btc-predictive-vnext4r3-remediation-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Compile remediation runtime
        run: python -m py_compile predictive_vnext4r3/worker.py predictive_vnext4r3/scheduler.py
      - name: Retry and receipt recovery regression tests
        run: python -m unittest predictive_vnext4r3.test_scheduler -v
      - name: Scheduler stress regression tests
        run: python -m unittest predictive_vnext4r3.test_scheduler_stress -v
      - name: Admission scorecard regression tests
        run: python -m unittest predictive_vnext4r3.test_scorecard -v
