name: BTC predictive vNext4R3 source smoke

on:
  push:
    branches: [btc-predictive-vnext4r3-source-20261005]
    paths:
      - predictive_vnext4r3/**
      - .github/workflows/btc-predictive-vnext4r3-source-smoke.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r3-source-20261005
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Compile R3 governance and scheduler
        run: python -I -m py_compile predictive_vnext4r3/worker.py predictive_vnext4r3/scorecard.py predictive_vnext4r3/scheduler.py predictive_vnext4r3/test_scorecard.py predictive_vnext4r3/test_scheduler.py predictive_vnext4r3/test_scheduler_stress.py
      - name: Rebuild frozen numerical baseline seed
        run: python -I predictive_vnext4/selftest.py
      - name: Admission regression suite
        run: python -I predictive_vnext4r3/test_scorecard.py -v
      - name: Scheduler regression suite
        run: python -I predictive_vnext4r3/test_scheduler.py -v
      - name: Scheduler 500-slot stress suite
        run: python -I predictive_vnext4r3/test_scheduler_stress.py -v
