name: BTC predictive vNext4R4 independent prestart audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/btc-predictive-vnext4r4-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: hourly
            branch: btc-predictive-vnext4r4-hourly
            workflow: .github/workflows/btc-predictive-vnext4r4-hourly.yml
            events_dir: predictive_vnext4r4_hourly_events
          - head: early15m
            branch: btc-predictive-vnext4r4-early15m
            workflow: .github/workflows/btc-predictive-vnext4r4-early15m.yml
            events_dir: predictive_vnext4r4_early15m_events
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Build clean immutable runtime
        run: |
          rm -rf /tmp/vnext4r4-runtime
          mkdir -p /tmp/vnext4r4-runtime
          git archive 8252b66b64fa524e56193777525e2b744308b4c7 | tar -x -C /tmp/vnext4r4-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Verify signed prestart ledger and immutable governance
        env:
          BTC_VNEXT4R4_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I /tmp/vnext4r4-runtime/predictive_vnext4r4/scorecard.py \
            --head ${{ matrix.head }} --repo-root "$GITHUB_WORKSPACE" > /tmp/r4-score.json
          cat /tmp/r4-score.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r4-score.json'))
          assert x['governance']['ok'] is True, x['governance']
          assert x['governance']['source_commit_sha']=='8252b66b64fa524e56193777525e2b744308b4c7'
          assert x['governance']['cosign_rekor_verified_events']==2
          assert x['score']['status']=='PENDING_NO_DUE_INDEPENDENT_WINDOWS'
          assert x['score']['admission_ready'] is False
          print('R4_SIGNED_PRESTART_ACCEPT')
          PY
      - name: Attack missing and late delivery receipts
        env:
          R4_HEAD: ${{ matrix.head }}
          R4_WORKFLOW_PATH: ${{ matrix.workflow }}
          R4_EVENTS_DIR: ${{ matrix.events_dir }}
        run: |
          python -I - <<'PY'
          import json,os,sys
          from datetime import timedelta
          from pathlib import Path
          sys.path.insert(0,'/tmp/vnext4r4-runtime')
          from predictive_vnext4r4.scorecard import START,canonical,digest,load_chain,verify_governance
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=os.environ['R4_HEAD']
          wf=os.environ['R4_WORKFLOW_PATH']
          events_dir=os.environ['R4_EVENTS_DIR']
          protocol_path='predictive_vnext4r4/protocol_hourly.json' if head=='hourly' else 'predictive_vnext4r4/protocol_early15m.json'
          protocol=json.loads((root/protocol_path).read_bytes())
          deadline=timedelta(minutes=int(protocol['issuance_deadline_minutes']))
          events,rekor=load_chain(root,events_dir,wf,wf)
          assert len(events)==2
          slot=START.strftime('%Y%m%dT%H%M%SZ')
          raw_path=protocol_path
          forecast={
              'schema':'btc-predictive-vnext4r4-event-v1',
              'sequence':3,
              'previous_hash':digest(canonical(events[-1])),
              'workflow_commit':events[-1]['workflow_commit'],
              'published_at_utc':(START+timedelta(seconds=30)).isoformat(),
              'type':'FORECAST_ISSUED',
              'idempotency_key':'forecast:'+slot,
              'slot':slot,
              'head':head,
              'anchor_utc':START.isoformat(),
              'due_utc':(START+(timedelta(hours=72) if head=='hourly' else timedelta(hours=4))).isoformat(),
              'reference_price':1.0,
              'lower_price':0.9,
              'upper_price':1.1,
              'raw_path':raw_path,
              'raw_sha256':digest((root/raw_path).read_bytes()),
              'trading_authority':False,
          }
          r1=dict(rekor);r1[3]=START+timedelta(minutes=1)
          g1=verify_governance(root,events+[forecast],r1,wf,wf,protocol_path)
          assert g1['ok'] is False
          assert any(x.get('reason')=='forecast_delivery_receipt_count' and x.get('count')==0 for x in g1['rejected']),g1
          print('R4_MISSING_RECEIPT_REJECTED')

          receipt={
              'schema':'btc-predictive-vnext4r4-event-v1',
              'sequence':4,
              'previous_hash':digest(canonical(forecast)),
              'workflow_commit':events[-1]['workflow_commit'],
              'published_at_utc':(START+deadline+timedelta(seconds=1)).isoformat(),
              'type':'DELIVERY_CONFIRMED',
              'idempotency_key':'delivery:forecast:'+slot,
              'slot':slot,
              'target_sequence':3,
              'target_event_hash':digest(canonical(forecast)),
              'remote_commit_sha':events[-1]['workflow_commit'],
              'remote_confirmed_at_utc':(START+deadline+timedelta(seconds=1)).isoformat(),
              'deadline_utc':(START+deadline).isoformat(),
              'trading_authority':False,
          }
          r2=dict(r1);r2[4]=START+deadline
          g2=verify_governance(root,events+[forecast,receipt],r2,wf,wf,protocol_path)
          assert g2['ok'] is False
          assert any(x.get('reason')=='delivery_receipt_rekor_not_before_deadline' for x in g2['rejected']),g2
          print('R4_LATE_RECEIPT_REJECTED')
          PY
      - name: Bind every Sigstore signature to declared workflow commit SHA
        env:
          R4_WORKFLOW_PATH: ${{ matrix.workflow }}
          R4_EVENTS_DIR: ${{ matrix.events_dir }}
        run: |
          set -euo pipefail
          identity="https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/$R4_WORKFLOW_PATH@refs/heads/main"
          first_event=""
          for p in "$R4_EVENTS_DIR"/????????.json; do
            [ -f "$p" ] || continue
            b="${p%.json}.sigstore.json"
            sha=$(python -c 'import json,sys; s=json.load(open(sys.argv[1])).get("workflow_commit",""); assert len(s)==40; print(s)' "$p")
            cosign verify-blob "$p" \
              --bundle "$b" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$sha" \
              --certificate-github-workflow-repository "sergeytren1984-ux/neora-b2b-v2-clean" \
              --certificate-github-workflow-ref "refs/heads/main" \
              --certificate-github-workflow-trigger "workflow_dispatch" >/dev/null
            echo "R4_SIGNER_SHA_BOUND file=$p workflow_commit=$sha"
            [ -n "$first_event" ] || first_event="$p"
          done
          test -n "$first_event"
          first_bundle="${first_event%.json}.sigstore.json"
          set +e
          cosign verify-blob "$first_event" \
            --bundle "$first_bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "0000000000000000000000000000000000000000" \
            --certificate-github-workflow-repository "sergeytren1984-ux/neora-b2b-v2-clean" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-trigger "workflow_dispatch" >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          echo "R4_FORGED_WORKFLOW_SHA_REJECTED"
      - name: Re-run admission scheduler and watchdog regressions
        run: |
          python -I /tmp/vnext4r4-runtime/predictive_vnext4r4/test_scorecard.py -v
          python -I /tmp/vnext4r4-runtime/predictive_vnext4r4/test_scheduler.py -v
          python -I /tmp/vnext4r4-runtime/predictive_vnext4r4/test_scheduler_stress.py -v
          python -I /tmp/vnext4r4-runtime/predictive_vnext4r4/test_chain_liveness.py -v
      - name: Verify production freeze gate
        env:
          BTC_VNEXT4R4_HEAD: ${{ matrix.head }}
          BTC_VNEXT4R4_ACTION: forecast
          BTC_VNEXT4R4_SOURCE_SHA: 8252b66b64fa524e56193777525e2b744308b4c7
          BTC_VNEXT4R4_WORKFLOW_PATH: ${{ matrix.workflow }}
          BTC_VNEXT4R4_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I - <<'PY'
          import os,sys
          sys.path.insert(0,'/tmp/vnext4r4-runtime')
          from predictive_vnext4r4.worker import CONFIG,verify_signed_freeze
          h=os.environ['BTC_VNEXT4R4_HEAD']
          verify_signed_freeze(CONFIG[h],h,'forecast')
          verify_signed_freeze(CONFIG[h],h,'outcome')
          print('R4_UNIFIED_FREEZE_GATE_ACCEPT')
          PY
      - name: Prove frozen scheduler tamper is rejected
        env:
          BTC_VNEXT4R4_HEAD: ${{ matrix.head }}
          BTC_VNEXT4R4_ACTION: forecast
          BTC_VNEXT4R4_SOURCE_SHA: 8252b66b64fa524e56193777525e2b744308b4c7
          BTC_VNEXT4R4_WORKFLOW_PATH: ${{ matrix.workflow }}
          BTC_VNEXT4R4_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          cp /tmp/vnext4r4-runtime/predictive_vnext4r4/scheduler.py /tmp/scheduler.clean
          printf '\n# adversarial mutation\n' >> /tmp/vnext4r4-runtime/predictive_vnext4r4/scheduler.py
          set +e
          python -I - <<'PY'
          import os,sys
          sys.path.insert(0,'/tmp/vnext4r4-runtime')
          from predictive_vnext4r4.worker import CONFIG,verify_signed_freeze
          h=os.environ['BTC_VNEXT4R4_HEAD']
          verify_signed_freeze(CONFIG[h],h,'forecast')
          PY
          rc=$?
          set -e
          test "$rc" -ne 0
          mv /tmp/scheduler.clean /tmp/vnext4r4-runtime/predictive_vnext4r4/scheduler.py
          echo "R4_TAMPER_REJECTED"
      - name: Verify non-fatal self-dispatch and independent watchdog policy
        run: |
          git show "${GITHUB_SHA}:.github/workflows/btc-predictive-vnext4r4-watchdog.yml" > /tmp/watchdog.yml
          git show "${GITHUB_SHA}:${{ matrix.workflow }}" > /tmp/unified.yml
          grep -q "workflow_run:" /tmp/watchdog.yml
          grep -q "cron: '*/5 \* \* \* \*'" /tmp/watchdog.yml
          grep -q "continue-on-error: true" /tmp/unified.yml
          grep -q "chain_liveness.py" /tmp/unified.yml
          echo "R4_LIVENESS_POLICY_ACCEPT"
