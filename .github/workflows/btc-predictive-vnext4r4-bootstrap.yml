name: BTC predictive vNext4R4 bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/btc-predictive-vnext4r4-bootstrap.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch both clean prospective chains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          failed=0
          for wf in btc-predictive-vnext4r4-hourly.yml btc-predictive-vnext4r4-early15m.yml; do
            ok=0
            for n in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$wf/dispatches" \
                -d '{"ref":"main"}' || true)
              if [ "$code" = "204" ]; then
                echo "BOOTSTRAP_DISPATCH_OK workflow=$wf attempt=$n"
                ok=1
                break
              fi
              echo "BOOTSTRAP_DISPATCH_RETRY workflow=$wf attempt=$n http=$code"
              cat /tmp/dispatch.out || true
              sleep $((n*2))
            done
            if [ "$ok" != "1" ]; then
              failed=1
            fi
          done
          exit "$failed"
