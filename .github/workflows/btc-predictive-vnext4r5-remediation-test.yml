name: BTC predictive vNext4R5 remediation regression

on:
  push:
    branches:
      - btc-predictive-vnext4r5-remediation-20261005
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Compile R5 runtime
        run: python -I -m py_compile predictive_vnext4r5/worker.py predictive_vnext4r5/scheduler.py predictive_vnext4r5/scorecard.py predictive_vnext4r5/chain_liveness.py
      - name: Immutable numerical selftest
        run: python -I predictive_vnext4/selftest.py
      - name: Scorecard expert-finding regressions
        run: python -I predictive_vnext4r5/test_scorecard.py -v
      - name: Scheduler receipt and signature regression
        run: python -I predictive_vnext4r5/test_scheduler.py -v
      - name: Scheduler stress regression
        run: python -I predictive_vnext4r5/test_scheduler_stress.py -v
      - name: Successor liveness regression
        run: python -I predictive_vnext4r5/test_chain_liveness.py -v
