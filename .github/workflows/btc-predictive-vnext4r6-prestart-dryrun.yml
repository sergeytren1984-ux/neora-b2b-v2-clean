name: BTC predictive vNext4R6 prestart dry run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext4r6-prestart-dryrun.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build immutable R6 runtime
        run: |
          rm -rf /tmp/vnext4r6-runtime
          mkdir -p /tmp/vnext4r6-runtime
          git archive 98d6ea6e981b3306f397a9105babc2e5d66ac7a0 | tar -x -C /tmp/vnext4r6-runtime

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Compute current dry-run distributions without evidence writes
        run: |
          python -I - <<'PY'
          import hashlib,json,math,sys
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          sys.path.insert(0,"/tmp/vnext4r6-runtime")
          from predictive_vnext4r6.worker import CONFIG,fetch_recent,arrays,slot_floor
          from predictive_vnext4r6.live_features import hourly_feature,early15m_feature,HOURLY_NAMES,EARLY15M_NAMES
          from predictive_vnext4r6.predict import load_artifact,predict_selected
          from predictive_vnext4r6.control import load_baseline,control_prediction

          root=Path("/tmp/vnext4r6-runtime")
          now=datetime.now(timezone.utc)
          out={"schema":"btc-predictive-vnext4r6-prestart-dryrun-v1","at_utc":now.isoformat(),"heads":{}}
          for head,cfg in CONFIG.items():
              anchor=slot_floor(now,cfg["cadence"])
              raw,closed=fetch_recent(anchor,cfg)
              hi,lo,c,v,trades,taker=arrays(closed)
              proto=json.loads((root/cfg["protocol"]).read_text())
              art=load_artifact(root/cfg["artifact"],proto["artifact_sha256"])
              bp=root/cfg["baseline"]
              got=hashlib.sha256(bp.read_bytes()).hexdigest()
              assert got==proto["baseline_sha256"],(head,got,proto["baseline_sha256"])
              base=load_baseline(bp)
              if head in ("1h","4h"):
                  x,meta=early15m_feature(hi,lo,c,v,trades,taker)
                  assert art["feature_names"]==EARLY15M_NAMES
                  vol=meta["rv4h"]
                  distance=meta["reference_price"]*vol*math.sqrt(float(cfg["bars"]))
              else:
                  x,meta=hourly_feature(hi,lo,c,v,trades,taker)
                  assert art["feature_names"]==HOURLY_NAMES
                  vol=meta["rv24"]
                  distance=meta["reference_price"]*vol*math.sqrt(24.0)
              pred=predict_selected(art,x)
              ctl=control_prediction(base,vol,anchor.isoformat(),())
              p=pred["class_distribution"]
              assert abs(sum(p.values())-1.0)<1e-8
              out["heads"][head]={
                  "anchor_utc":anchor.isoformat(),
                  "reference_price":meta["reference_price"],
                  "lower_price":meta["reference_price"]-distance,
                  "upper_price":meta["reference_price"]+distance,
                  "selected_model":pred["selected_model"],
                  "class_distribution":p,
                  "control":ctl,
                  "closed_rows":len(closed),
                  "status":"DRYRUN_PASS",
              }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
