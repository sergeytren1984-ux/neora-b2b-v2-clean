name: BTC predictive vNext4R6 structural research

on:
  push:
    branches: [btc-predictive-vnext4r6-research-20261006]
    paths:
      - research_vnext4r6/benchmark_r6.py
      - research_vnext4r6/fetch_15m_r6.py
      - research_vnext4r6/test_benchmark_r6.py
      - research_vnext4r6/README.md
      - .github/workflows/btc-predictive-vnext4r6-research.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-predictive-vnext4r6-structural-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r6-research-20261006
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Recreate exact historical hourly source
        run: python research_vnext/fetch_hourly.py
      - name: Recreate R6 15m source through Sep 2026
        run: python research_vnext4r6/fetch_15m_r6.py
      - name: Compile and contract tests
        run: |
          python -I -m py_compile research_vnext4r6/benchmark_r6.py research_vnext4r6/test_benchmark_r6.py
          python research_vnext4r6/test_benchmark_r6.py -v
      - name: Run R6 structural benchmark
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python research_vnext4r6/benchmark_r6.py
      - name: Commit immutable research result
        run: |
          git config user.name 'btc-predictive-vnext4r6[bot]'
          git config user.email 'btc-predictive-vnext4r6[bot]@users.noreply.github.com'
          git add research_vnext4r6/structural_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record R6 structural research result"
          git reset --hard HEAD
          git fetch origin btc-predictive-vnext4r6-research-20261006
          git rebase origin/btc-predictive-vnext4r6-research-20261006
          git push origin HEAD:btc-predictive-vnext4r6-research-20261006
