name: BTC predictive vNext4R6 prospective source regression

on:
  push:
    branches: [btc-predictive-vnext4r6-prospective-source-20261006]
    paths:
      - predictive_vnext4r6/**
      - .github/workflows/btc-predictive-vnext4r6-source-regression.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: btc-predictive-vnext4r6-source-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r6-prospective-source-20261006
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Recreate exact historical hourly source
        run: python research_vnext/fetch_hourly.py

      - name: Recreate exact R6 15m historical source
        run: python research_vnext4r6/fetch_15m_r6.py

      - name: Compile prospective runtime
        run: |
          python -I -m py_compile predictive_vnext4r6/worker.py
          python -I -m py_compile predictive_vnext4r6/scheduler.py
          python -I -m py_compile predictive_vnext4r6/scorecard.py
          python -I -m py_compile predictive_vnext4r6/control.py
          python -I -m py_compile predictive_vnext4r6/live_features.py
          python -I -m py_compile predictive_vnext4r6/predict.py
          python -I -m py_compile predictive_vnext4r6/chain_liveness.py

      - name: Verify artifact freeze
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r6/selftest.py

      - name: Verify tamper defenses
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r6/negative_tests.py

      - name: Verify Q3 numerical replay
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r6/replay_q3.py

      - name: Verify protocol hashes and baseline freeze
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          for head in ('1h','4h','24h'):
              p=json.loads((root/f'predictive_vnext4r6/protocol_{head}.json').read_text())
              for key,path in (
                  ('artifact_sha256',root/f'predictive_vnext4r6/head_{head}.joblib'),
                  ('baseline_sha256',root/f'predictive_vnext4r6/baseline_{head}.json'),
              ):
                  got=hashlib.sha256(path.read_bytes()).hexdigest()
                  assert got==p[key],(head,key,got,p[key])
              assert p['start_utc']=='2026-10-07T00:00:00Z'
              assert p['selected_model']=='ensemble_equal'
              assert p['trading_authority'] is False
          meta=json.loads((root/'predictive_vnext4r6/baseline_metadata.json').read_text())
          assert meta['trading_authority'] is False
          assert meta['prospective_admission'] is False
          print('R6_PROTOCOL_BASELINE_HASHES_PASS')
          PY

      - name: Run prospective regression tests
        env:
          PYTHONPATH: .
        run: |
          python -I predictive_vnext4r6/test_scorecard.py -v
          python -I predictive_vnext4r6/test_scheduler.py -v
          python -I predictive_vnext4r6/test_scheduler_stress.py -v
          python -I predictive_vnext4r6/test_chain_liveness.py -v

      - name: Scheduler preflight all heads
        env:
          PYTHONPATH: .
        run: |
          for head in 1h 4h 24h; do
            BTC_VNEXT4R6_HEAD="$head" BTC_VNEXT4R6_PREFLIGHT=1               PYTHONPATH=. python predictive_vnext4r6/scheduler.py
          done
