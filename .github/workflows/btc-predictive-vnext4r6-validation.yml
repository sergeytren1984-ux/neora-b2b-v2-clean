name: BTC predictive vNext4R6 frozen candidate validation

on:
  push:
    branches: [btc-predictive-vnext4r6-freeze-20261006]
    paths:
      - predictive_vnext4r6/replay_q3.py
      - predictive_vnext4r6/negative_tests.py
      - predictive_vnext4r6/predict.py
      - predictive_vnext4r6/selftest.py
      - predictive_vnext4r6/freeze_metadata.json
      - predictive_vnext4r6/head_1h.joblib
      - predictive_vnext4r6/head_4h.joblib
      - predictive_vnext4r6/head_24h.joblib
      - .github/workflows/btc-predictive-vnext4r6-validation.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: btc-predictive-vnext4r6-frozen-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r6-freeze-20261006
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Recreate exact historical hourly source
        run: python research_vnext/fetch_hourly.py

      - name: Recreate exact R6 15m source through Sep 2026
        run: python research_vnext4r6/fetch_15m_r6.py

      - name: Compile validation sources
        run: |
          python -I -m py_compile predictive_vnext4r6/replay_q3.py
          python -I -m py_compile predictive_vnext4r6/negative_tests.py

      - name: Frozen candidate selftest
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r6/selftest.py

      - name: Negative tamper and drift tests
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r6/negative_tests.py

      - name: Replay untouched 2026Q3 fold
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r6/replay_q3.py
