name: BTC predictive vNext4R7 remediation

on:
  push:
    branches: [btc-predictive-vnext4r7-remediation-20261007]
    paths:
      - predictive_vnext4r7/**
      - .github/workflows/btc-predictive-vnext4r7-remediation.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-predictive-vnext4r7-remediation
  cancel-in-progress: true

jobs:
  integrity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r7-remediation-20261007
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch R6 evidence and main history
        run: |
          git fetch origin main
          git fetch origin btc-predictive-vnext4r6-1h
          git fetch origin btc-predictive-vnext4r6-4h
          git fetch origin btc-predictive-vnext4r6-24h

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Compile R7 remediation sources
        run: |
          python -I -m py_compile predictive_vnext4r7/integrity.py
          python -I -m py_compile predictive_vnext4r7/checkpoint.py
          python -I -m py_compile predictive_vnext4r7/checkpoint_writer.py
          python -I -m py_compile predictive_vnext4r7/journal_runtime.py
          python -I -m py_compile predictive_vnext4r7/full_verify.py
          python -I -m py_compile predictive_vnext4r7/benchmark_checkpoint_scaling.py
          python -I -m py_compile predictive_vnext4r7/episodes.py
          python -I -m py_compile predictive_vnext4r7/scorecard_core.py
          python -I -m py_compile predictive_vnext4r7/tail_research.py
          python -I -m py_compile predictive_vnext4r7/audit_r6_bindings.py
          python -I -m py_compile predictive_vnext4r7/test_remediation.py

      - name: Run remediation unit tests
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r7/test_remediation.py -v

      - name: Verify remediation protocol templates are non-production
        run: |
          python - <<'PY'
          import json,pathlib
          for head in ("1h","4h","24h"):
              p=json.loads(pathlib.Path(f"predictive_vnext4r7/protocol_template_{head}.json").read_text())
              assert p["prospective_start_utc"] is None
              assert p["admission_enabled"] is False
              assert p["trading_authority"] is False
              assert p["checkpointing"]["full_cryptographic_replay_before_admission"] is True
              assert p["workflow_binding"]["every_event_workflow_commit_must_match_signed_manifest_content_hash"] is True
              assert p["event_invariants"]["unique_type_head_slot"] is True
          print("R7_PROTOCOL_TEMPLATES_SAFE")
          PY

      - name: Audit current R6 evidence with strict workflow binding
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          for spec in             "1h btc-predictive-vnext4r6-1h"             "4h btc-predictive-vnext4r6-4h"             "24h btc-predictive-vnext4r6-24h"
          do
            set -- $spec
            head="$1"
            evbranch="$2"
            dir="/tmp/r6-$head"
            rm -rf "$dir"
            git worktree add --detach "$dir" "origin/$evbranch"
            PYTHONPATH="$GITHUB_WORKSPACE" python -I - <<PY
          import json,sys
          sys.path.insert(0,"$GITHUB_WORKSPACE")
          from predictive_vnext4r7.audit_r6_bindings import run
          print(json.dumps(run("$head","$dir"),indent=2,sort_keys=True))
          PY
            git worktree remove "$dir" --force
          done

      - name: Measure R6 verification scaling and R7 checkpoint projection
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          for spec in             "1h btc-predictive-vnext4r6-1h"             "4h btc-predictive-vnext4r6-4h"             "24h btc-predictive-vnext4r6-24h"
          do
            set -- $spec
            head="$1"
            evbranch="$2"
            dir="/tmp/bench-$head"
            rm -rf "$dir"
            git worktree add --detach "$dir" "origin/$evbranch"
            PYTHONPATH="$GITHUB_WORKSPACE" python -I - <<PY
          import json,sys
          sys.path.insert(0,"$GITHUB_WORKSPACE")
          from predictive_vnext4r7.benchmark_checkpoint_scaling import run
          print(json.dumps(run("$head","$dir",12),indent=2,sort_keys=True))
          PY
            git worktree remove "$dir" --force
          done

  tail-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r7-remediation-20261007
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Recreate exact historical hourly source
        run: python research_vnext/fetch_hourly.py

      - name: Recreate exact R6 15m historical source
        run: python research_vnext4r6/fetch_15m_r6.py

      - name: Run predeclared tail research
        env:
          PYTHONPATH: .
        run: |
          PYTHONPATH=. python predictive_vnext4r7/tail_research.py > /tmp/tail_research_result.json
          python -m json.tool /tmp/tail_research_result.json >/dev/null

      - name: Commit research result
        run: |
          cp /tmp/tail_research_result.json predictive_vnext4r7/tail_research_result.json
          git config user.name 'btc-predictive-vnext4r7[bot]'
          git config user.email 'btc-predictive-vnext4r7[bot]@users.noreply.github.com'
          git add predictive_vnext4r7/tail_research_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R7: record predeclared tail research result"
          git fetch origin btc-predictive-vnext4r7-remediation-20261007
          git rebase origin/btc-predictive-vnext4r7-remediation-20261007
          git push origin HEAD:btc-predictive-vnext4r7-remediation-20261007
