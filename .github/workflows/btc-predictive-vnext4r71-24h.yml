name: BTC predictive vNext4R7.1 24h unified chain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext4r71-24h.yml
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: btc-predictive-vnext4r71-24h-unified-chain
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'push' && vars.BTC_VNEXT4R71_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch signed workflow-dispatch epoch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/btc-predictive-vnext4r71-24h.yml/dispatches" \
            -d '{"ref":"main"}'

  unified-session:
    if: github.event_name == 'workflow_dispatch' && vars.BTC_VNEXT4R71_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4r71-24h
          fetch-depth: 0
          persist-credentials: true

      - name: Validate frozen launch variables
        env:
          R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
          R71_START_UTC: ${{ vars.BTC_VNEXT4R71_START_UTC }}
        run: |
          [[ "$R71_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R71_START_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]

      - name: Build clean immutable R7.1 runtime
        env:
          R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
        run: |
          rm -rf /tmp/vnext4r71-runtime
          mkdir -p /tmp/vnext4r71-runtime
          git archive "$R71_SOURCE_SHA" | tar -x -C /tmp/vnext4r71-runtime

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Configure evidence author
        run: |
          git config user.name 'btc-predictive-vnext4r71-24h[bot]'
          git config user.email 'btc-predictive-vnext4r71-24h[bot]@users.noreply.github.com'

      - name: Immutable numerical selftest
        run: |
          python -I - <<'PY'
          import runpy,sys
          sys.path.insert(0,"/tmp/vnext4r71-runtime")
          runpy.run_path(
              "/tmp/vnext4r71-runtime/predictive_vnext4r6/selftest.py",
              run_name="__main__",
          )
          PY

      - name: Scheduler preflight
        env:
          BTC_VNEXT4R71_HEAD: 24h
          BTC_VNEXT4R71_PREFLIGHT: '1'
          BTC_VNEXT4R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
          BTC_VNEXT4R71_START_UTC: ${{ vars.BTC_VNEXT4R71_START_UTC }}
        run: python -I /tmp/vnext4r71-runtime/predictive_vnext4r71/scheduler.py

      - name: Pre-start signed registration and freeze
        env:
          BTC_VNEXT4R71_HEAD: 24h
          BTC_VNEXT4R71_ACTION: forecast
          BTC_VNEXT4R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
          BTC_VNEXT4R71_START_UTC: ${{ vars.BTC_VNEXT4R71_START_UTC }}
          BTC_VNEXT4R71_WORKFLOW_PATH: .github/workflows/btc-predictive-vnext4r71-24h.yml
          BTC_VNEXT4R71_EXPECTED_REF: refs/heads/main
          BTC_VNEXT4R71_EXPECTED_TRIGGER: workflow_dispatch
          BTC_VNEXT4R71_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I - <<'PY'
          import sys
          sys.path.insert(0,"/tmp/vnext4r71-runtime")
          from predictive_vnext4r71.worker import START,utcnow,main
          if utcnow() < START:
              main()
              print("R71_PRESTART_REGISTRATION_VERIFIED")
          else:
              print("R71_POSTSTART_SKIP_REGISTRATION_STEP")
          PY

      - name: Ensure successor before long session
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I /tmp/vnext4r71-runtime/predictive_vnext4r71/chain_liveness.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "btc-predictive-vnext4r71-24h.yml" \
            --ref main \
            --current-run-id "$GITHUB_RUN_ID"

      - name: Run unified forecast and due-outcome session
        env:
          BTC_VNEXT4R71_HEAD: 24h
          BTC_VNEXT4R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
          BTC_VNEXT4R71_START_UTC: ${{ vars.BTC_VNEXT4R71_START_UTC }}
          BTC_VNEXT4R71_WORKFLOW_PATH: .github/workflows/btc-predictive-vnext4r71-24h.yml
          BTC_VNEXT4R71_EXPECTED_REF: refs/heads/main
          BTC_VNEXT4R71_EXPECTED_TRIGGER: workflow_dispatch
          BTC_VNEXT4R71_EVIDENCE_ROOT: ${{ github.workspace }}
        run: python -I /tmp/vnext4r71-runtime/predictive_vnext4r71/scheduler.py
