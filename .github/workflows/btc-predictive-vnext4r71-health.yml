name: BTC predictive vNext4R7.1 health guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-predictive-vnext4r71-health.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: btc-predictive-vnext4r71-health-guard
  cancel-in-progress: true

jobs:
  health:
    if: vars.BTC_VNEXT4R71_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - head: 1h
            branch: btc-predictive-vnext4r71-1h
          - head: 4h
            branch: btc-predictive-vnext4r71-4h
          - head: 24h
            branch: btc-predictive-vnext4r71-24h
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch deployment ref and build immutable runtime
        env:
          R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
        run: |
          [[ "$R71_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          rm -rf /tmp/vnext4r71-runtime
          mkdir -p /tmp/vnext4r71-runtime
          git archive "$R71_SOURCE_SHA" | tar -x -C /tmp/vnext4r71-runtime

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Verify checkpoint, anchor, deployment bundle and slot lifecycle
        env:
          BTC_VNEXT4R71_HEAD: ${{ matrix.head }}
          BTC_VNEXT4R71_SOURCE_SHA: ${{ vars.BTC_VNEXT4R71_SOURCE_SHA }}
          BTC_VNEXT4R71_START_UTC: ${{ vars.BTC_VNEXT4R71_START_UTC }}
          BTC_VNEXT4R71_EXPECTED_REF: refs/heads/main
          BTC_VNEXT4R71_EXPECTED_TRIGGER: workflow_dispatch
          BTC_VNEXT4R71_EVIDENCE_ROOT: ${{ github.workspace }}
        run: |
          python -I - <<'PY'
          import runpy,sys
          sys.path.insert(0,"/tmp/vnext4r71-runtime")
          runpy.run_path(
              "/tmp/vnext4r71-runtime/predictive_vnext4r71/health.py",
              run_name="__main__",
          )
          PY

      - name: Verify workflow liveness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R71_WORKFLOW_FILE: btc-predictive-vnext4r71-${{ matrix.head }}.yml
        run: |
          python - <<'PY'
          import json,os,urllib.request
          url=(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/workflows/{os.environ['R71_WORKFLOW_FILE']}/runs?per_page=30"
          )
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          })
          runs=json.load(urllib.request.urlopen(req))["workflow_runs"]
          live=[
              r for r in runs
              if r["status"] in ("in_progress","queued","pending","waiting","requested")
          ]
          assert live,[(r["id"],r["status"]) for r in runs[:10]]
          print("R71_LIVENESS_PASS",[(r["id"],r["status"]) for r in live])
          PY
