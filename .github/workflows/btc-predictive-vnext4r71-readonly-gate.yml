name: BTC predictive vNext4R7.6 read-only release gate

on:
  push:
    branches: [btc-predictive-vnext4r76-remediation-20261008]
    paths:
      - predictive_vnext4r71/**
      - predictive_vnext4r7/scorecard_core.py
      - predictive_vnext4r7/episodes.py
      - .github/workflows/btc-predictive-vnext4r71-*.yml
      - .github/workflows/btc-predictive-vnext4r76-activation.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: btc-predictive-vnext4r76-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact immutable checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "R76_EXACT_SHA=$GITHUB_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Compile release candidate
        run: |
          python -I -m py_compile predictive_vnext4r71/integrity.py
          python -I -m py_compile predictive_vnext4r71/checkpoint.py
          python -I -m py_compile predictive_vnext4r71/checkpoint_writer.py
          python -I -m py_compile predictive_vnext4r71/journal_runtime.py
          python -I -m py_compile predictive_vnext4r71/crypto.py
          python -I -m py_compile predictive_vnext4r71/admission.py
          python -I -m py_compile predictive_vnext4r71/activation.py
          python -I -m py_compile predictive_vnext4r71/anchor.py
          python -I -m py_compile predictive_vnext4r71/worker.py
          python -I -m py_compile predictive_vnext4r71/scheduler.py
          python -I -m py_compile predictive_vnext4r71/chain_liveness.py
          python -I -m py_compile predictive_vnext4r71/health.py
          python -I -m py_compile predictive_vnext4r71/tail_research.py
          python -I -m py_compile predictive_vnext4r71/e2e_checkpoint.py
          python -I -m py_compile predictive_vnext4r71/e2e_negative_admission.py
          python -I -m py_compile predictive_vnext4r71/benchmark_checkpoint_scale.py
          python -I -m py_compile predictive_vnext4r71/numerical_lifecycle_e2e.py
          python -I -m py_compile predictive_vnext4r71/test_remediation.py
          python -I -m py_compile predictive_vnext4r7/scorecard_core.py
          python -I -m py_compile predictive_vnext4r7/episodes.py

      - name: Adversarial and fault-injection regression
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r71/test_remediation.py -v

      - name: Real R6 numerical worker lifecycle
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r71/numerical_lifecycle_e2e.py

      - name: Expected-journal scale benchmark
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r71/benchmark_checkpoint_scale.py

      - name: Verify release policy is fail-closed and complete
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          expected=[
            ".github/workflows/btc-predictive-vnext4r71-1h.yml",
            ".github/workflows/btc-predictive-vnext4r71-4h.yml",
            ".github/workflows/btc-predictive-vnext4r71-24h.yml",
            ".github/workflows/btc-predictive-vnext4r71-watchdog.yml",
            ".github/workflows/btc-predictive-vnext4r71-health.yml",
            ".github/workflows/btc-predictive-vnext4r76-activation.yml",
          ]
          for wf in expected:
              text=pathlib.Path(wf).read_text()
              if wf.endswith("vnext4r76-activation.yml"):
                  assert "BTC_VNEXT4R76_ACTIVATION_ENABLED" in text,wf
                  assert "unified-chain" in text,wf
              else:
                  assert "BTC_VNEXT4R71_ENABLED" in text,wf
          for head in ("1h","4h","24h"):
              p=json.loads(pathlib.Path(f"predictive_vnext4r71/protocol_{head}.json").read_text())
              assert p["parent_r6_source_sha"]=="98d6ea6e981b3306f397a9105babc2e5d66ac7a0"
              assert p["parent_r6_candidate_sha"]=="faa0244a34516177c9e23cccc30f522462f7423f"
              assert p["admission_enabled"] is False
              assert p["trading_authority"] is False
              assert p["start_utc"] is None
              assert p["prospective_start_utc"] is None
              req=p["signed_manifest_requirements"]
              assert req["all_production_workflows_required"]==expected
              assert p["skill_inference"]["block_confidence_intervals_required"] is True
              assert p["skill_inference"]["separate_stress_episode_gate_required"] is True
              ae=p["admission_entrypoint"]
              assert ae["caller_supplied_current_tip_forbidden"] is True
              assert ae["actual_git_head_must_equal_fetched_remote_tip_before_replay"] is True
              assert ae["remote_tip_revalidated_before_scoring"] is True
              assert ae["remote_tip_revalidated_after_scoring"] is True
              assert ae["remote_tip_toctou_fail_closed"] is False
              assert ae["authenticated_protocol_loaded_from_immutable_git_object"] is True
              assert ae["used_protocol_sha256_must_equal_signed_protocol_sha256"] is True
              assert ae["private_detached_snapshot_for_all_file_reads"] is True
              assert ae["decision_semantics"]=="SNAPSHOT_AS_OF_EXACT_EVIDENCE_SHA"
              assert ae["absolute_latest_tip_atomicity_claimed"] is False
              assert ae["consumer_must_reject_if_evidence_tip_differs"] is True
              assert ae["consumer_compare_and_swap_or_lease_required_for_activation"] is True
              assert ae["consumer_validation_entrypoint"]=="predictive_vnext4r71.activation.consume_under_exclusive_lease"
              assert ae["consumer_snapshot_freshness_guard_required"] is True
              ap=p["activation_policy"]
              assert ap["trading_activation_enabled"] is False
              assert ap["side_effects_forbidden_without_exclusive_lease"] is True
              assert ap["lease_provider"]=="github-actions-concurrency"
              assert ap["concurrency_group"]==f"btc-predictive-vnext4r71-{head}-unified-chain"
              ea=p["e2e_audit_artifacts"]
              assert ea["real_r6_numerical_worker_lifecycle_required"] is True
              assert ea["e2e_dummy_insufficient_for_numerical_lifecycle"] is True
              assert ea["numerical_lifecycle_fixture_is_engineering_not_prospective_market_evidence"] is True
              rp=p["raw_evidence_provenance"]
              assert rp["raw_first_addition_commit_must_equal_event_publication_commit"] is True
              assert rp["raw_reuse_from_prior_commit_forbidden"] is True
              artifact=pathlib.Path(p["artifact_path"]).read_bytes()
              baseline=pathlib.Path(p["baseline_path"]).read_bytes()
              assert hashlib.sha256(artifact).hexdigest()==p["artifact_sha256"]
              assert hashlib.sha256(baseline).hexdigest()==p["baseline_sha256"]
          print("R76_READONLY_POLICY_PASS")
          PY

      - name: Ensure tests did not mutate tracked candidate
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          echo "R76_READONLY_GATE_PASS"
