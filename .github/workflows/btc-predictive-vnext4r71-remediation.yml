name: BTC predictive vNext4R7.2 remediation

on:
  push:
    branches: [btc-predictive-vnext4r72-remediation-20261007]
    paths:
      - predictive_vnext4r71/**
      - predictive_vnext4r7/scorecard_core.py
      - predictive_vnext4r7/episodes.py
      - .github/workflows/btc-predictive-vnext4r71-*.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: btc-predictive-vnext4r72-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Compile exact immutable candidate
        run: |
          python -I -m py_compile predictive_vnext4r71/integrity.py
          python -I -m py_compile predictive_vnext4r71/checkpoint.py
          python -I -m py_compile predictive_vnext4r71/checkpoint_writer.py
          python -I -m py_compile predictive_vnext4r71/journal_runtime.py
          python -I -m py_compile predictive_vnext4r71/crypto.py
          python -I -m py_compile predictive_vnext4r71/admission.py
          python -I -m py_compile predictive_vnext4r71/anchor.py
          python -I -m py_compile predictive_vnext4r71/worker.py
          python -I -m py_compile predictive_vnext4r71/scheduler.py
          python -I -m py_compile predictive_vnext4r71/chain_liveness.py
          python -I -m py_compile predictive_vnext4r71/health.py
          python -I -m py_compile predictive_vnext4r71/tail_research.py
          python -I -m py_compile predictive_vnext4r71/e2e_checkpoint.py
          python -I -m py_compile predictive_vnext4r71/e2e_negative_admission.py
          python -I -m py_compile predictive_vnext4r71/benchmark_checkpoint_scale.py
          python -I -m py_compile predictive_vnext4r71/test_remediation.py
          python -I -m py_compile predictive_vnext4r7/scorecard_core.py

      - name: Run adversarial remediation tests
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r71/test_remediation.py -v

      - name: Scale checkpoint binding to the expected 42-day journal
        env:
          PYTHONPATH: .
        run: PYTHONPATH=. python predictive_vnext4r71/benchmark_checkpoint_scale.py

      - name: Verify protocol templates remain launch-disabled
        run: |
          python - <<'PY'
          import json,pathlib
          for head in ("1h","4h","24h"):
              p=json.loads(pathlib.Path(f"predictive_vnext4r71/protocol_{head}.json").read_text())
              assert p["admission_enabled"] is False
              assert p["trading_authority"] is False
              assert p["start_utc"] is None
              assert p["prospective_start_utc"] is None
              assert p["admission_entrypoint"]["required"]=="predictive_vnext4r71/admission.py"
              assert p["checkpointing"]["exact_verified_branch_commit_prefix_required"] is True
              assert p["checkpointing"]["full_cryptographic_replay_before_admission"] is True
              assert p["checkpointing"]["anchor_required"] is True
              assert p["checkpointing"]["anchor_branch"] is None
              assert p["checkpointing"]["checkpoint_path"]==f"predictive_vnext4r71_checkpoints/{head}.json"
              assert p["skill_inference"]["block_confidence_intervals_required"] is True
              assert p["skill_inference"]["separate_stress_episode_gate_required"] is True
              assert p["admission"]["stress_episode_policy"]["minimum_episodes_for_skill_claim"]==3
              req=p["signed_manifest_requirements"]
              assert len(req["all_protocols_required"])==3
              assert len(req["all_production_workflows_required"])==5
              for wf in req["all_production_workflows_required"]:
                  assert pathlib.Path(wf).exists(),wf
          print("R7_2_PROTOCOLS_FAIL_CLOSED")

  tail-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Recreate historical sources
        run: |
          python research_vnext/fetch_hourly.py
          python research_vnext4r6/fetch_15m_r6.py

      - name: Re-run coherent tail research
        env:
          PYTHONPATH: .
        run: |
          PYTHONPATH=. python predictive_vnext4r71/tail_research.py > /tmp/r71-tail.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/r71-tail.json"))
          assert x["policy"]["q3_role"]=="SEEN_DIAGNOSTIC_NOT_HOLDOUT"
          for head,row in x["heads"].items():
              for side in ("downside","upside"):
                  c=row[side]["coherence"]
                  for split,v in c.items():
                      assert v["projected_quantile_crossing_rows"]==0,(head,side,split,v)
                      assert v["projected_threshold_order_violation_rows"]==0,(head,side,split,v)
              print(head,row["gate"])
          print("R7_2_TAIL_COHERENCE_PASS")
          PY

  signed-checkpoint-e2e:
    needs: integrity-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Real OIDC/Rekor checkpoint and full-admission replay
        env:
          PYTHONPATH: .
          R71_E2E_BRANCH: btc-predictive-vnext4r72-e2e-${{ github.run_id }}
          R71_EXPECTED_TRIGGER: ${{ github.event_name }}
        run: PYTHONPATH=. python predictive_vnext4r71/e2e_checkpoint.py

  signed-negative-admission-e2e:
    needs: integrity-regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2

      - name: Real signed negative admission attacks
        env:
          PYTHONPATH: .
          R71_EXPECTED_TRIGGER: ${{ github.event_name }}
          R72_NEGATIVE_E2E_BRANCH: btc-predictive-vnext4r72-negative-e2e-${{ github.run_id }}
        run: PYTHONPATH=. python predictive_vnext4r71/e2e_negative_admission.py

