name: BTC predictive vNext5R1 reproducible first-passage freeze

on:
  push:
    branches:
      - btc-predictive-vnext5r1-freeze-remediation-20261008
    paths:
      - 'predictive_vnext5/**'
      - '.github/workflows/btc-predictive-vnext5r1-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-predictive-vnext5r1-reproducible-freeze
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        builder: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact numerical environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.18.1 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.7.0
          python -VV
          python -m pip freeze | sort
          python - <<'PY'
          import json,threadpoolctl
          print(json.dumps(threadpoolctl.threadpool_info(),indent=2,sort_keys=True))
          PY

      - name: Rebuild fixed historical sources
        run: |
          python research_vnext/fetch_hourly.py
          python research_vnext4r6/fetch_15m_r6.py

      - name: Build frozen package independently
        env:
          PYTHONPATH: .
        run: |
          rm -rf predictive_vnext5/build
          python predictive_vnext5/freeze_first_passage.py
          python predictive_vnext5/selftest.py
          python -m unittest predictive_vnext5.test_freeze_remediation -v

      - name: Upload independent build
        uses: actions/upload-artifact@v4
        with:
          name: vnext5r1-build-${{ matrix.builder }}
          path: predictive_vnext5/build/**
          if-no-files-found: error
          retention-days: 90

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact numerical environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.18.1 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.7.0

      - uses: actions/download-artifact@v4
        with:
          name: vnext5r1-build-a
          path: /tmp/build-a

      - uses: actions/download-artifact@v4
        with:
          name: vnext5r1-build-b
          path: /tmp/build-b

      - name: Exact-byte compare independent builds
        env:
          PYTHONPATH: .
        run: |
          python predictive_vnext5/compare_freeze_builds.py \
            --a /tmp/build-a \
            --b /tmp/build-b \
            --output /tmp/reproducibility_report.json

      - name: Assemble authoritative package from build A
        run: |
          rm -rf predictive_vnext5/build
          mkdir -p predictive_vnext5/build
          find /tmp/build-a -type f -maxdepth 5 -exec cp {} predictive_vnext5/build/ \;
          cp /tmp/reproducibility_report.json predictive_vnext5/build/reproducibility_report.json

      - name: Final package self-test
        env:
          PYTHONPATH: .
        run: |
          python predictive_vnext5/selftest.py
          python -m unittest predictive_vnext5.test_freeze_remediation -v
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("predictive_vnext5/build/reproducibility_report.json")
          x=json.loads(p.read_text())
          assert x["status"]=="PASS"
          print("VNEXT5R1_EXACT_BYTE_REPRODUCIBILITY_PASS")
          PY

      - name: Print authoritative inner hashes
        run: |
          sha256sum \
            predictive_vnext5/reproducibility_contract.json \
            predictive_vnext5/evaluation_supplement.json \
            predictive_vnext5/prospective_score.py \
            predictive_vnext5/freeze_spec.json \
            predictive_vnext5/prospective_protocol.json \
            predictive_vnext5/predictor.py \
            predictive_vnext5/freeze_first_passage.py \
            predictive_vnext5/build/*

      - name: Upload authoritative remediated freeze
        uses: actions/upload-artifact@v4
        with:
          name: btc-vnext5r1-first-passage-freeze
          path: |
            predictive_vnext5/reproducibility_contract.json
            predictive_vnext5/evaluation_supplement.json
            predictive_vnext5/prospective_score.py
            predictive_vnext5/freeze_spec.json
            predictive_vnext5/prospective_protocol.json
            predictive_vnext5/predictor.py
            predictive_vnext5/freeze_first_passage.py
            predictive_vnext5/selftest.py
            predictive_vnext5/test_freeze_remediation.py
            predictive_vnext5/compare_freeze_builds.py
            predictive_vnext5/build/**
          if-no-files-found: error
          retention-days: 90
