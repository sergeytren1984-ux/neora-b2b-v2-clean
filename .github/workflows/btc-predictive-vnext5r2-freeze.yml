name: BTC predictive vNext5R2 strict evaluator freeze

on:
  push:
    branches:
      - btc-predictive-vnext5r2-evaluator-remediation-20261008
    paths:
      - 'predictive_vnext5/**'
      - '.github/workflows/btc-predictive-vnext5r2-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: btc-predictive-vnext5r2-strict-evaluator-freeze
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        builder: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact numerical environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.18.1 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.7.0

      - name: Download exact parent frozen model artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-vnext5-first-passage-freeze
          path: /tmp/parent-freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37746080651

      - name: Rebuild deterministic evaluation runtime only
        run: |
          python research_vnext/fetch_hourly.py
          python research_vnext4r6/fetch_15m_r6.py

      - name: Assemble unchanged model binaries with R2 evaluator
        env:
          PYTHONPATH: .
        run: |
          rm -rf predictive_vnext5/build
          python predictive_vnext5/assemble_binary_pinned_freeze.py \
            --parent-dir /tmp/parent-freeze
          python predictive_vnext5/selftest.py
          python -m unittest predictive_vnext5.test_freeze_remediation -v
          python predictive_vnext5/f4_adversarial_regression.py

      - name: Upload independent assembly
        uses: actions/upload-artifact@v4
        with:
          name: vnext5r2-assembly-${{ matrix.builder }}
          path: predictive_vnext5/build/**
          if-no-files-found: error
          retention-days: 90

  compare:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact numerical environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.18.1 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.7.0

      - uses: actions/download-artifact@v4
        with:
          name: vnext5r2-assembly-a
          path: /tmp/build-a

      - uses: actions/download-artifact@v4
        with:
          name: vnext5r2-assembly-b
          path: /tmp/build-b

      - name: Exact-byte compare independent assemblies
        env:
          PYTHONPATH: .
        run: |
          python predictive_vnext5/compare_freeze_builds.py \
            --a /tmp/build-a \
            --b /tmp/build-b \
            --output /tmp/reproducibility_report.json

      - name: Assemble authoritative package from assembly A
        run: |
          rm -rf predictive_vnext5/build
          mkdir -p predictive_vnext5/build
          find /tmp/build-a -type f -maxdepth 5 -exec cp {} predictive_vnext5/build/ \;
          cp /tmp/reproducibility_report.json predictive_vnext5/build/reproducibility_report.json

      - name: Final strict-evaluator regression
        env:
          PYTHONPATH: .
        run: |
          python predictive_vnext5/selftest.py
          python -m unittest predictive_vnext5.test_freeze_remediation -v
          python predictive_vnext5/f4_adversarial_regression.py
          python - <<'PY'
          import json,pathlib
          x=json.loads(
              pathlib.Path(
                  "predictive_vnext5/build/reproducibility_report.json"
              ).read_text()
          )
          assert x["status"]=="PASS"
          print("VNEXT5R2_EXACT_BYTE_AND_F4_ADVERSARIAL_PASS")
          PY

      - name: Print authoritative hashes
        run: |
          sha256sum \
            predictive_vnext5/reproducibility_contract.json \
            predictive_vnext5/evaluation_supplement.json \
            predictive_vnext5/prospective_score.py \
            predictive_vnext5/f4_adversarial_regression.py \
            predictive_vnext5/freeze_spec.json \
            predictive_vnext5/prospective_protocol.json \
            predictive_vnext5/predictor.py \
            predictive_vnext5/assemble_binary_pinned_freeze.py \
            predictive_vnext5/build/*

      - name: Upload authoritative R2 freeze
        uses: actions/upload-artifact@v4
        with:
          name: btc-vnext5r2-first-passage-freeze
          path: |
            predictive_vnext5/reproducibility_contract.json
            predictive_vnext5/evaluation_supplement.json
            predictive_vnext5/prospective_score.py
            predictive_vnext5/f4_adversarial_regression.py
            predictive_vnext5/freeze_spec.json
            predictive_vnext5/prospective_protocol.json
            predictive_vnext5/predictor.py
            predictive_vnext5/assemble_binary_pinned_freeze.py
            predictive_vnext5/selftest.py
            predictive_vnext5/test_freeze_remediation.py
            predictive_vnext5/compare_freeze_builds.py
            predictive_vnext5/build/**
          if-no-files-found: error
          retention-days: 90
