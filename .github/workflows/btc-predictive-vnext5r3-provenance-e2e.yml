name: BTC predictive vNext5R3 signed provenance E2E

on:
  push:
    branches:
      - btc-predictive-vnext5r3-provenance-remediation-20261008
    paths:
      - 'predictive_vnext5/**'
      - '.github/workflows/btc-predictive-vnext5r3-provenance-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-predictive-vnext5r3-provenance-e2e
  cancel-in-progress: true

jobs:
  signed-provenance-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Install exact scorer environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.18.1 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.7.0

      - name: Real signed evidence to canonical-row replay
        env:
          PYTHONPATH: .
          VNEXT5R3_E2E_BRANCH: btc-predictive-vnext5r3-provenance-e2e-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: |
          python predictive_vnext5/provenance_e2e.py
