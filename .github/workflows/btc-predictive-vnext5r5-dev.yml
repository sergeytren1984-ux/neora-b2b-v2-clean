name: BTC predictive vNext5R5 competing-risks dev

on:
  push:
    branches:
      - btc-predictive-vnext5r5-competing-risks-dev-20261008
    paths:
      - 'research_vnext5/**'
      - '.github/workflows/btc-predictive-vnext5r5-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-predictive-vnext5r5-competing-risks-dev
  cancel-in-progress: true

jobs:
  predictive-r5-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Rebuild historical BTC sources
        run: |
          python research_vnext/fetch_hourly.py
      - name: Run 24h competing-risks development diagnostic
        env:
          PYTHONPATH: .
        run: |
          python research_vnext5/predictive_research_r5_dev.py
          test -s research_vnext5/predictive_research_r5_dev_result.json
      - name: Upload R5 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-vnext5r5-competing-risks-dev
          path: research_vnext5/predictive_research_r5_dev_result.json
          if-no-files-found: error
