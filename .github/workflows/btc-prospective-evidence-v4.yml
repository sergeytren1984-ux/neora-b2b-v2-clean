name: BTC prospective evidence v4

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-prospective-evidence-v4.yml, btc-evidence-v4-heartbeat.txt]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-prospective-evidence-v4
  cancel-in-progress: false

jobs:
  collect-sign-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out epoch 4 evidence transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-evidence-v4
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify frozen epoch 4 runtime
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 61ef69ff378d0101526524c1fd8a784eec341569 -- runtime/
          git fetch origin main
          git config user.name 'btc-evidence-v4[bot]'
          git config user.email 'btc-evidence-v4[bot]@users.noreply.github.com'
      - name: Capture, verify, sign and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime/collector_worker.py
