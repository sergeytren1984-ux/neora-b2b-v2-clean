name: BTC prospective evidence v5

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-prospective-evidence-v5.yml, btc-evidence-v5-heartbeat.txt]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-prospective-evidence-v5
  cancel-in-progress: false

jobs:
  collect-sign-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out epoch 5 evidence transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-evidence-v5
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify frozen epoch 5 runtime
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code a67fd26aaf009a05ffca90e204f6c72652dd38ca -- runtime/
          git fetch origin main
          git config user.name 'btc-evidence-v5[bot]'
          git config user.email 'btc-evidence-v5[bot]@users.noreply.github.com'
      - name: Capture, verify, sign and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime/collector_worker.py
