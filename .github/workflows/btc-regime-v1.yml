name: BTC regime challenger v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-regime-v1.yml
      - btc-regime-v1-heartbeat.txt
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-regime-challenger-v1
  cancel-in-progress: false

jobs:
  regime-prospective:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out regime challenger branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-regime-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Configure identity
        run: |
          git config user.name 'btc-regime-v1[bot]'
          git config user.email 'btc-regime-v1[bot]@users.noreply.github.com'
      - name: Run regime selftest
        run: python3 regime_v1/selftest.py
      - name: Run prospective regime worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 regime_v1/worker.py
