name: BTC regime v2 audited challenger

on:
  push:
    branches: [main]
    paths:
      - btc-regime-v2-heartbeat.txt
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-regime-v2-audit
  cancel-in-progress: false

jobs:
  prospective-shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out audited challenger branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-regime-v2-audit
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Configure evidence identity
        run: |
          git config user.name 'btc-regime-v2-audit[bot]'
          git config user.email 'btc-regime-v2-audit[bot]@users.noreply.github.com'
      - name: Run audited selftest
        run: python3 regime_v2/selftest.py
      - name: Run prospective audited worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 regime_v2/worker.py
