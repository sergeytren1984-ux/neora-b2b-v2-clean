name: BTC regime v4 hardened challenger

on:
  push:
    branches: [main]
    paths:
      - btc-regime-v4-hardened-heartbeat.txt
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['BTC context evidence']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-regime-v4-hardened
  cancel-in-progress: false

jobs:
  prospective-shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out expert challenger branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-regime-v4-hardened
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Configure evidence identity
        run: |
          git config user.name 'btc-regime-v4-hardened[bot]'
          git config user.email 'btc-regime-v4-hardened[bot]@users.noreply.github.com'
      - name: Run expert selftest
        run: python3 regime_v4/selftest.py
      - name: Run adversarial negative tests
        run: python3 regime_v4/negative_tests.py
      - name: Run context time E2E regression
        run: python3 regime_v4/context_e2e_test.py
      - name: Run frozen diagnostic replay test
        run: python3 regime_v4/replay_test.py
      - name: Run prospective expert worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 regime_v4/worker.py
