name: Retire legacy BTC arbiter transport after signed v4 decision

on:
  push:
    branches: [main]
    paths: [.github/workflows/btc-retire-v3-after-v4.yml]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-arbitration-v4
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Confirm prospective v4 decision then disable legacy dispatchers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64,datetime as dt,json,os,subprocess,urllib.request
          from pathlib import Path
          UTC=dt.timezone.utc
          repo=os.environ['REPO_NAME']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'User-Agent':'btc-arbiter-v4-retirement'}
          events=sorted(Path('arbiter_v4_events').glob('[0-9]'*8+'.json'))
          decisions=[]
          for p in events:
              event=json.loads(p.read_bytes())
              if event.get('type')!='ARBITRATION_DECISION_ISSUED':continue
              bundle=p.with_suffix('.sigstore.json')
              subprocess.run(['cosign','verify-blob',str(p),'--bundle',str(bundle),
                 '--certificate-identity',f'https://github.com/{repo}/.github/workflows/btc-arbitration-v4.yml@refs/heads/main',
                 '--certificate-oidc-issuer','https://token.actions.githubusercontent.com'],check=True)
              entries=json.loads(bundle.read_bytes())['verificationMaterial']['tlogEntries']
              anchor=dt.datetime.fromisoformat(event['anchor_utc'])
              if (event.get('idempotency_key')=='decision:'+event['slot']+':4h' and
                  anchor>=dt.datetime(2026,10,3,9,tzinfo=UTC) and
                  all(e.get('inclusionProof',{}).get('checkpoint') for e in entries) and
                  any(anchor<=dt.datetime.fromtimestamp(int(e['integratedTime']),UTC)<
                      anchor+dt.timedelta(minutes=45) for e in entries)):
                  decisions.append((p,event))
          if not decisions:raise RuntimeError('No timely signed prospective v4 decision; legacy transport retained')
          targets=['btc-arbitration-v3.yml','btc-arbitration-v3-independent-guard.yml',
                   'btc-arbitration-v3-sequencer.yml']
          receipt={'schema':'btc-v3-retirement-after-v4-v1',
                   'v4_decision':str(decisions[0][0]),
                   'v4_slot':decisions[0][1]['slot'],
                   'retired_at_utc':dt.datetime.now(UTC).isoformat(),
                   'disabled_workflows':[]}
          for name in targets:
              url=f'https://api.github.com/repos/{repo}/actions/workflows/{name}/disable'
              request=urllib.request.Request(url,headers=headers,method='PUT')
              with urllib.request.urlopen(request,timeout=25) as response:
                  if response.status!=204:raise RuntimeError(f'{name}: HTTP {response.status}')
              receipt['disabled_workflows'].append(name)
          path=f"btc_scorecard/v3_retirement_{os.environ['RUN_ID']}.json"
          body={'message':'Record legacy v3 retirement after signed prospective v4 decision',
                'branch':'main','content':base64.b64encode(
                    (json.dumps(receipt,sort_keys=True)+'\n').encode()).decode()}
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',
                                         data=json.dumps(body).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(request,timeout=25) as response:
              if response.status!=201:raise RuntimeError('retirement receipt not published')
          print('RETIRED',receipt)
          PY
