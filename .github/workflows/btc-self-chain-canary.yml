name: BTC self-chain dispatch canary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-self-chain-canary.yml
  workflow_dispatch:
    inputs:
      hop:
        description: chain hop
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

jobs:
  hop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record hop
        env:
          HOP: ${{ inputs.hop || '0' }}
        run: |
          echo "CANARY_HOP=$HOP"
          date -u +'%Y-%m-%dT%H:%M:%SZ'
      - name: Dispatch next hop
        if: ${{ fromJSON(inputs.hop || '0') < 2 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOP: ${{ inputs.hop || '0' }}
        run: |
          set -euo pipefail
          NEXT=$((HOP+1))
          BODY="{\"ref\":\"main\",\"inputs\":{\"hop\":\"$NEXT\"}}"
          for n in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/btc-self-chain-canary.yml/dispatches"               -d "$BODY" || true)
            if [ "$code" = "204" ]; then
              echo "SELF_DISPATCH_OK next=$NEXT attempt=$n"
              exit 0
            fi
            cat /tmp/dispatch.out || true
            sleep $((n*2))
          done
          exit 1
