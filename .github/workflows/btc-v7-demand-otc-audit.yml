name: BTC v7 demand price OTC skill experiment (research only)

on:
  push:
    branches: [btc-predictive-vnext7-demand-price-otc-20261011]
    paths:
      - btc_demand_v7/train.py
      - btc_demand_v7/otc_decision.py
      - btc_demand_v7/test_regressions.py
      - .github/workflows/btc-v7-demand-otc-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: btc-v7-skill-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scikit-learn==1.7.2 scipy==1.16.3 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - name: Unit and negative no-lookahead tests
        run: |
          python -m py_compile btc_demand_v7/train.py btc_demand_v7/otc_decision.py
          python -m btc_demand_v7.test_regressions
          python -m btc_skill_rebuild.test_audit
      - name: Load signed historical 5m spot research artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-vnext6-causal-skill-audit-81beeaf6d8c4d55452e28439b84fdf7af708f690
          path: /tmp/btc-v7-spot
          run-id: 38166535215
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Load signed historical 1m research artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-vnext6-minute-comparison-f1cead14844d900b23d39d46b5a620bd1a14b2fa
          path: /tmp/btc-v7-minute
          run-id: 38167948896
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Verify both frozen source raw content hashes
        run: |
          python - <<'PY'
          import hashlib,gzip,json,pathlib
          for base,doc,raw,key in (
              ("/tmp/btc-v7-spot","research_result.json","raw_5m_closed_klines.json.gz","raw_sha256"),
              ("/tmp/btc-v7-minute","micro_audit.json","raw_minute_klines.json.gz","raw_1m_sha256")
          ):
              root=pathlib.Path(base)
              j=json.loads((root/doc).read_text())
              with gzip.open(root/raw,"rb") as f: content=f.read()
              actual=hashlib.sha256(content).hexdigest()
              if actual!=j[key]:raise RuntimeError("RAW_HASH_MISMATCH "+base)
              print("MARKET_RAW_SHA256_VERIFIED",base,actual)
          PY
      - name: Train one unified candidate and score untouched chronological windows
        run: |
          python -m btc_demand_v7.train \
            --spot-raw /tmp/btc-v7-spot/raw_5m_closed_klines.json.gz \
            --minute-raw /tmp/btc-v7-minute/raw_minute_klines.json.gz \
            --futures-raw btc_skill_rebuild/raw/oi_funding_20260914_20261011.json.gz \
            --output /tmp/btc-v7-audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign scored audit and model artifact via GitHub OIDC Rekor
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle /tmp/btc-v7-audit/audit.sigstore.json /tmp/btc-v7-audit/audit.json
          cosign sign-blob --yes --bundle /tmp/btc-v7-audit/candidate.sigstore.json /tmp/btc-v7-audit/candidate.joblib
          cosign sign-blob --yes --bundle /tmp/btc-v7-audit/paired_validation_errors.sigstore.json /tmp/btc-v7-audit/paired_validation_errors.json
          cosign sign-blob --yes --bundle /tmp/btc-v7-audit/spot_paired_validation_errors.sigstore.json /tmp/btc-v7-audit/spot_paired_validation_errors.json
      - uses: actions/upload-artifact@v4
        with:
          name: btc-v7-research-only-${{ github.sha }}
          path: /tmp/btc-v7-audit/
          retention-days: 90
          if-no-files-found: error
