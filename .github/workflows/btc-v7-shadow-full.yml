name: BTC v7R1 remediated research shadow

on:
  push:
    branches: [btc-v7r1-independent-audit-remediation-20261012]
    paths:
      - btc_demand_v7/infer_live.py
      - btc_demand_v7/live_snapshot.py
      - btc_demand_v7/otc_decision.py
      - btc_demand_v7/release_guard.py
      - .github/workflows/btc-v7-shadow-full.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: btc-v7-full-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VERIFIED_TRAIN_IDENTITY: https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/.github/workflows/btc-v7-demand-otc-audit.yml@refs/heads/btc-predictive-vnext7-demand-price-otc-20261011
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scikit-learn==1.7.2 scipy==1.16.3 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: btc-v7-research-only-3d08e5a767f1848a9e10d6bea1ef939c2b77238a
          path: /tmp/btc-v7-frozen
          run-id: 38169934478
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify EXACT research model + historical audit signatures
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/btc-v7-frozen
          cosign verify-blob candidate.joblib \
            --bundle candidate.sigstore.json \
            --certificate-identity "$VERIFIED_TRAIN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob audit.json \
            --bundle audit.sigstore.json \
            --certificate-identity "$VERIFIED_TRAIN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob spot_paired_validation_errors.json \
            --bundle spot_paired_validation_errors.sigstore.json \
            --certificate-identity "$VERIFIED_TRAIN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python -m json.tool spot_paired_validation_errors.json >/dev/null
          cd "$GITHUB_WORKSPACE"
          python -m btc_demand_v7.release_guard /tmp/btc-v7-frozen btc_demand_v7/trusted_release.json
          echo VERIFIED_SOURCE_PIN_38169934478
      - name: Validate shadow release contracts
        run: |
          python -m py_compile btc_demand_v7/infer_live.py btc_demand_v7/live_snapshot.py
          python -m btc_demand_v7.test_snapshot
          python -m btc_demand_v7.test_regressions
      - name: Capture fresh keyless spot and separate OKX positioning
        run: |
          python -m btc_demand_v7.live_snapshot --out /tmp/btc-v7-shadow
      - name: Compute spot-consistent 1h 4h morning forecasts and delayed OTC comparison
        run: |
          python -m btc_demand_v7.infer_live \
            --snapshot /tmp/btc-v7-shadow/snapshot.json \
            --candidate /tmp/btc-v7-frozen/candidate.joblib \
            --paired /tmp/btc-v7-frozen/spot_paired_validation_errors.json \
            --audit /tmp/btc-v7-frozen/audit.json \
            --trusted-release btc_demand_v7/trusted_release.json \
            --output /tmp/btc-v7-shadow/live_forecast.json
      - name: Sign exact raw, observation, and live inference (OIDC/Rekor)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle /tmp/btc-v7-shadow/snapshot.sigstore.json /tmp/btc-v7-shadow/snapshot.json
          cosign sign-blob --yes --bundle /tmp/btc-v7-shadow/observation.sigstore.json /tmp/btc-v7-shadow/observation.json
          cosign sign-blob --yes --bundle /tmp/btc-v7-shadow/live_forecast.sigstore.json /tmp/btc-v7-shadow/live_forecast.json
          cp btc_demand_v7/trusted_release.json /tmp/btc-v7-shadow/trusted_release.json
          cosign sign-blob --yes --bundle /tmp/btc-v7-shadow/trusted_release.sigstore.json /tmp/btc-v7-shadow/trusted_release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc-v7-full-shadow-${{ github.run_id }}
          path: /tmp/btc-v7-shadow/
          retention-days: 90
          if-no-files-found: error
