name: BTC v7 point-in-time demand snapshot (shadow only)

on:
  push:
    branches: [btc-predictive-vnext7-demand-price-otc-20261011]
    paths:
      - btc_demand_v7/live_snapshot.py
      - btc_demand_v7/test_snapshot.py
      - .github/workflows/btc-v7-shadow-snapshot.yml
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: btc-v7-prospective-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Reject stale-candle and future-OI regressions
        run: |
          python -m py_compile btc_demand_v7/live_snapshot.py
          python -m btc_demand_v7.test_snapshot
      - name: Fetch point-in-time market snapshot
        run: |
          python -m btc_demand_v7.live_snapshot --out /tmp/btc-v7-shadow
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign raw and derived receipt with GitHub OIDC Rekor
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle /tmp/btc-v7-shadow/snapshot.sigstore.json \
            /tmp/btc-v7-shadow/snapshot.json
          cosign sign-blob --yes \
            --bundle /tmp/btc-v7-shadow/observation.sigstore.json \
            /tmp/btc-v7-shadow/observation.json
      - uses: actions/upload-artifact@v4
        with:
          name: btc-v7-prospective-shadow-${{ github.run_id }}
          path: /tmp/btc-v7-shadow/
          if-no-files-found: error
          retention-days: 90
