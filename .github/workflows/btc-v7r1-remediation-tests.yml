name: BTC v7R1 independent audit remediation negative tests

on:
  push:
    branches: [btc-v7r1-independent-audit-remediation-20261012]
    paths:
      - btc_demand_v7/**
      - .github/workflows/btc-v7r1-remediation-tests.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: btc-v7r1-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-negative-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TRAIN_IDENTITY: https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/.github/workflows/btc-v7-demand-otc-audit.yml@refs/heads/btc-predictive-vnext7-demand-price-otc-20261011
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Fixed mathematical runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.16.3 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - uses: actions/download-artifact@v4
        with:
          name: btc-v7-research-only-3d08e5a767f1848a9e10d6bea1ef939c2b77238a
          run-id: 38169934478
          path: /tmp/frozen-training
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          name: btc-v7-full-shadow-38170130611
          run-id: 38170130611
          path: /tmp/expert-live
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Validate all frozen research input cryptographic signatures
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/frozen-training
          for pair in candidate:joblib audit:json spot_paired_validation_errors:json; do
            name=${pair%:*}
            ext=${pair#*:}
            cosign verify-blob "${name}.${ext}" --bundle "${name}.sigstore.json" \
              --certificate-identity "$TRAIN_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Run exact release/certificate source-SHA and all negative tests
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile btc_demand_v7/{infer_live,otc_decision,live_snapshot,release_guard,test_remediation}.py
          python -m btc_demand_v7.test_snapshot
          python -m btc_demand_v7.test_regressions
          python -m btc_demand_v7.release_guard /tmp/frozen-training btc_demand_v7/trusted_release.json
          python -m btc_demand_v7.test_remediation \
            /tmp/frozen-training \
            /tmp/expert-live/snapshot.json \
            btc_demand_v7/trusted_release.json
      - name: Produce independently signed regression receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v7r1-remediation
          python - <<'PY'
          import datetime,json,os,pathlib,hashlib
          p=pathlib.Path('/tmp/v7r1-remediation/receipt.json')
          o={"schema":"btc-v7r1-negative-regression-receipt-v1",
             "source_sha":os.environ["GITHUB_SHA"],
             "github_run_id":os.environ["GITHUB_RUN_ID"],
             "created_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
             "scope":"source/OTC-contract/provenance tests only, NOT predictive skill",
             "admission_ready":False,"trading_authority":False}
          p.write_text(json.dumps(o,sort_keys=True,indent=2)+"\n")
          PY
          cosign sign-blob --yes --bundle /tmp/v7r1-remediation/receipt.sigstore.json /tmp/v7r1-remediation/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: btc-v7r1-negative-tests-${{ github.sha }}
          path: /tmp/v7r1-remediation/
          if-no-files-found: error
          retention-days: 90
