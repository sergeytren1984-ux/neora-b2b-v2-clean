name: BTC v7R2 prewarmed GitHub-only prospective clock

on:
  workflow_dispatch: {}
  schedule:
    - cron: '8 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: btc-v7r2-one-clock
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Prewarm exact 15m forecast+outcome+score jobs; hand off before runner limit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt,json,os,time,urllib.request
          UTC=dt.timezone.utc
          START=dt.datetime(2026,10,13,0,0,tzinfo=UTC)
          END=dt.datetime(2026,10,20,0,0,tzinfo=UTC)
          # Finish all 24h outcomes and their scorecards before stopping.
          DRAIN_END=END+dt.timedelta(hours=26)
          REF="btc-v7r2-prospective-contour-20261012"
          WORKER="btc-v7r2-prospective.yml"
          CLOCK="btc-v7r2-github-clock.yml"
          REPO=os.environ["GH_REPOSITORY"]
          TOKEN=os.environ["GH_TOKEN"]
          HEADERS={"Authorization":"Bearer "+TOKEN,
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"btc-v7r2-registered-prospective-clock"}
          started=dt.datetime.now(UTC)
          cutoff=started+dt.timedelta(hours=5,minutes=12)
          observed=set()
          def dispatch(workflow,ref,inputs=None):
              payload=json.dumps({"ref":ref,"inputs":inputs or {}}).encode()
              url=f"https://api.github.com/repos/{REPO}/actions/workflows/{workflow}/dispatches"
              req=urllib.request.Request(url,headers=HEADERS,data=payload,method="POST")
              with urllib.request.urlopen(req,timeout=25) as response:
                  if response.status!=204:raise RuntimeError("unexpected dispatch HTTP "+str(response.status))
          def next_slot(now):
              # Forecasts target the preceding quarter-hour anchor. At slot+3m
              # a closed Binance 5m candle is normally already published.
              origin=START+dt.timedelta(minutes=3)
              if now<=origin:return 0,origin
              n=int((now-origin).total_seconds()//900)+1
              return n,origin+dt.timedelta(minutes=15*n)
          print("CLOCK_START",started.isoformat(),flush=True)
          while dt.datetime.now(UTC)<cutoff:
              current=dt.datetime.now(UTC)
              if current>=DRAIN_END:break
              if current<START:
                  time.sleep(min(30,max(1,(START-current).total_seconds())))
                  continue
              n,when=next_slot(current)
              # Resume a recently due checkpoint immediately after a runner
              # handoff if it still fits the 10m issuance deadline.
              slot=START+dt.timedelta(minutes=15*(n-1))
              if n>0 and current-slot<dt.timedelta(minutes=10):
                  when=current;n-=1
              if when>DRAIN_END:
                  time.sleep(min(30,max(1,(DRAIN_END-current).total_seconds())))
                  continue
              pause=(when-current).total_seconds()
              if pause>0:
                  time.sleep(min(pause,30));continue
              slot=START+dt.timedelta(minutes=15*n)
              key=slot.isoformat()
              if key in observed:
                  time.sleep(10);continue
              observed.add(key)
              try:
                  dispatch(WORKER,REF,{"action":"tick","days":"7"})
                  print("TICK_DISPATCH_ACCEPTED",key,dt.datetime.now(UTC).isoformat(),flush=True)
              except Exception as exc:
                  print("TICK_DISPATCH_FAILED",key,type(exc).__name__,str(exc)[:160],flush=True)
                  raise
              time.sleep(4)
          if dt.datetime.now(UTC)<DRAIN_END:
              dispatch(CLOCK,"main")
              print("CLOCK_SUCCESSOR_DISPATCHED",dt.datetime.now(UTC).isoformat(),flush=True)
          else:
              print("CLOCK_COMPLETED_AFTER_ALL_DUE_TARGETS",flush=True)
          PY
