name: BTC v7R2 frozen prospective register / forecast / outcome / score

on:
  push:
    branches: [btc-v7r2-prospective-contour-20261012]
    paths:
      - btc_demand_v7/prospective_core.py
      - btc_demand_v7/prospective_worker.py
      - btc_demand_v7/test_prospective.py
      - btc_demand_v7/event_semantics.py
      - btc_demand_v7/otc_execution.py
      - btc_demand_v7/test_event_semantics.py
      - btc_demand_v7/test_otc_execution.py
      - btc_demand_v7/demand_change.py
      - btc_demand_v7/test_demand_change.py
      - btc_demand_v7/skill_metrics.py
      - btc_demand_v7/test_skill_metrics.py
      - btc_demand_v7/frozen_train_priors.json
      - .github/workflows/btc-v7r2-prospective.yml
  workflow_dispatch:
    inputs:
      action:
        description: "register or tick"
        type: choice
        options: [register, tick]
        required: true
      start_utc:
        description: "future aligned UTC time, required for register"
        required: false
        type: string
      days:
        description: "number of fixed preregistered days"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: btc-v7r2-evidence-serialized
  cancel-in-progress: false

jobs:
  prospective:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      TRAIN_IDENTITY: https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/.github/workflows/btc-v7-demand-otc-audit.yml@refs/heads/btc-predictive-vnext7-demand-price-otc-20261011
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact numerical runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.16.3 scikit-learn==1.7.2 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Static contract and no-backfill tests before registration or tick
        run: |
          python -m py_compile btc_demand_v7/prospective_core.py btc_demand_v7/prospective_worker.py
          python -m btc_demand_v7.test_prospective
          python -m btc_demand_v7.test_event_semantics
          python -m btc_demand_v7.test_otc_execution
          python -m btc_demand_v7.test_demand_change
          python -m btc_demand_v7.test_skill_metrics
          python -m btc_demand_v7.test_regressions
          python -m btc_demand_v7.test_snapshot
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'register'
        with:
          name: btc-vnext6-minute-comparison-f1cead14844d900b23d39d46b5a620bd1a14b2fa
          path: /tmp/btc-r2-train-prior-raw
          run-id: 38167948896
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Check signed 1m TRAIN source and reproducible frozen baseline prior
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'register'
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob /tmp/btc-r2-train-prior-raw/raw_minute_klines.json.gz \
            --bundle /tmp/btc-r2-train-prior-raw/raw_minute_klines.sigstore.json \
            --certificate-identity https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/.github/workflows/btc-vnext6-micro-audit.yml@refs/heads/btc-predictive-vnext6-skill-rebuild-20261011 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python - <<'PY'
          from btc_demand_v7.release_guard import certificate_source_sha
          b="/tmp/btc-r2-train-prior-raw/raw_minute_klines.sigstore.json"
          if certificate_source_sha(b)!="f1cead14844d900b23d39d46b5a620bd1a14b2fa":
              raise RuntimeError("wrong train input signer source SHA")
          print("SIGNED_TRAIN_SOURCE_IDENTITY_AND_SHA_VERIFIED")
          PY
          python -m btc_demand_v7.freeze_train_prior \
            --raw /tmp/btc-r2-train-prior-raw/raw_minute_klines.json.gz \
            --out /tmp/frozen_prior_recomputed.json
          cmp /tmp/frozen_prior_recomputed.json btc_demand_v7/frozen_train_priors.json
          echo TRAIN_ONLY_PRIORS_REPRODUCED_BYTE_IDENTICAL
      - name: Download one already frozen, signed, unproven research model
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'tick'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: btc-v7-research-only-3d08e5a767f1848a9e10d6bea1ef939c2b77238a
          run-id: 38169934478
          path: /tmp/frozen-training
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Verify all training signatures and exact source release
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'tick'
        shell: bash
        run: |
          set -euo pipefail
          for x in candidate.joblib audit.json spot_paired_validation_errors.json; do
            cosign verify-blob "/tmp/frozen-training/$x" \
              --bundle "/tmp/frozen-training/${x%.*}.sigstore.json" \
              --certificate-identity "$TRAIN_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          python -m btc_demand_v7.release_guard /tmp/frozen-training btc_demand_v7/trusted_release.json
      - name: Register future schedule and freeze source BEFORE the first due
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'register'
        run: |
          python -m btc_demand_v7.prospective_worker register \
            --start-utc "${{ inputs.start_utc }}" --days "${{ inputs.days }}"
      - name: Produce one signed current forecast, mature outcomes and scorecard
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'tick'
        run: |
          python -m btc_demand_v7.prospective_worker tick \
            --model-dir /tmp/frozen-training \
            --trusted-release btc_demand_v7/trusted_release.json
