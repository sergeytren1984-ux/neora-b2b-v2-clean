name: BTC v7R3 causal analogue price challenge — research only

on:
  push:
    branches: [btc-v7r3-demand-stateful-challenger-20261012]
    paths:
      - btc_demand_v7/analog_price_v3.py
      - .github/workflows/btc-v7r3-analog-price-eval.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: btc-v7r3-analog-price-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-direct-future-price:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install fixed analogue-math dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scikit-learn==1.7.2 scipy==1.16.3 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: btc-vnext6-causal-skill-audit-81beeaf6d8c4d55452e28439b84fdf7af708f690
          path: /tmp/signed-causal-spot
          run-id: 38166535215
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify original frozen and signed market raw before modelling
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob /tmp/signed-causal-spot/raw_5m_closed_klines.json.gz \
            --bundle /tmp/signed-causal-spot/raw_5m_closed_klines.sigstore.json \
            --certificate-identity https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/.github/workflows/btc-vnext6-skill-eval.yml@refs/heads/btc-predictive-vnext6-skill-rebuild-20261011 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python - <<'PY'
          import gzip,hashlib,json,pathlib
          from btc_demand_v7.release_guard import certificate_source_sha
          base=pathlib.Path("/tmp/signed-causal-spot")
          if certificate_source_sha(str(base/"raw_5m_closed_klines.sigstore.json"))!="81beeaf6d8c4d55452e28439b84fdf7af708f690":
              raise RuntimeError("signed spot producer commit mismatch")
          j=json.loads((base/"research_result.json").read_text())
          with gzip.open(base/"raw_5m_closed_klines.json.gz","rb") as f:raw=f.read()
          if hashlib.sha256(raw).hexdigest()!=j["raw_sha256"]:
              raise RuntimeError("raw spot immutable-source hash mismatch")
          print("SIGNED_RAW_SPOT_SHA_AND_PRODUCER_VERIFIED")
          PY
      - name: Evaluate fixed causal analog price challenger on chronological diagnostic split
        run: |
          python -m py_compile btc_demand_v7/analog_price_v3.py
          python -m btc_demand_v7.analog_price_v3 \
            --signed-spot-raw /tmp/signed-causal-spot/raw_5m_closed_klines.json.gz \
            --out /tmp/v7r3-analog-audit.json
      - name: Sign exact numerical result with public Sigstore Rekor
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle /tmp/v7r3-analog-audit.sigstore.json \
            /tmp/v7r3-analog-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc-v7r3-analogue-price-diagnostic-${{ github.sha }}
          path: /tmp/v7r3-analog-audit*
          retention-days: 90
          if-no-files-found: error
