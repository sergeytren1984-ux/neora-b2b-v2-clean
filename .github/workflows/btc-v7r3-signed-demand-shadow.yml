name: BTC raw source continuity, separate second registered epoch
on:
  push:
    branches: [btc-core-forward-source2-20261014]
    paths: [.github/workflows/btc-v7r3-signed-demand-shadow.yml, btc_core_extended/**]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [register, forecast, outcome]
        required: true
        default: forecast
      start_utc:
        type: string
        required: false
      days:
        type: string
        default: '1'
        required: false
permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: btc-core-forward-data-second-fixed-source
  cancel-in-progress: false
jobs:
  collect-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Check fixed grid and no trade authority
        run: python -m btc_core_extended.test_collector
      - name: Signed raw data only, no price forecast and no trade
        run: python -m btc_core_extended.collector watch --minutes 90
      - name: Continue bounded collection until declared end
        if: success()
        run: python -m btc_core_extended.collector relay
