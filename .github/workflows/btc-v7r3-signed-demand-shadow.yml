name: BTC immutable macro input receipts
on:
  push:
    branches: [btc-core-macro-source-20261013]
    paths: [.github/workflows/btc-v7r3-signed-demand-shadow.yml, btc_core_macro/**]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [register, forecast, outcome]
        required: true
        default: forecast
permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: btc-core-macro-fixed-source
  cancel-in-progress: false
jobs:
  signed-macro-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/btc_core_forecast:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Install pinned numeric parser
        run: python -m pip install numpy==2.3.5
      - name: Reject substituted symbols, future and tampered quotes
        run: python -m unittest btc_core_forecast.test_macro_quote_adapter
      - name: Signed fixed-source macro records
        run: python -m btc_core_macro.worker watch
      - name: Continue same immutable macro grid
        if: success()
        run: python -m btc_core_macro.worker relay
