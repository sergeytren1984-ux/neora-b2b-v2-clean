name: BTC fresh minute price quality guard, not a predictive model
on:
  push:
    branches: [btc-core-live-quality-20261013]
    paths: [.github/workflows/btc-v7r3-signed-demand-shadow.yml, btc_core_quality/**]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [register, forecast, outcome]
        required: true
        default: forecast
      start_utc:
        type: string
        required: false
      days:
        type: string
        default: '7'
        required: false
permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: btc-price-health-fixed-source
  cancel-in-progress: false
jobs:
  minute-market-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONHASHSEED: '0'
      PYTHONPATH: ${{ github.workspace }}/btc_core_forecast:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify movement, intraminute spikes and stale-source rejection
        run: python -m unittest btc_core_forecast.test_impulse_check
      - name: Signed fresh minute observations, not advance predictions
        run: python -m btc_core_quality.worker watch
      - name: Continue the fixed observation grid
        if: success()
        run: python -m btc_core_quality.worker relay
