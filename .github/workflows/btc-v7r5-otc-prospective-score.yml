name: BTC v7R5 prospective OTC 1h-vs-2h signed economic outcome audit

on:
  push:
    branches: [btc-v7r5-otc-independent-outcome-audit-20261012]
    paths:
      - btc_demand_v7/otc_signed_counterfactual_audit_v5.py
      - btc_demand_v7/test_otc_signed_counterfactual_audit_v5.py
      - .github/workflows/btc-v7r5-otc-prospective-score.yml
  workflow_dispatch: {}
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: btc-v7r5-independent-otc-4h-score-readonly
  cancel-in-progress: false

jobs:
  prospective-actual-price-proxy-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/auditor
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: auditor
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-v7r5-corrected-signed-evidence-20261013
          path: signed-r5
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Test 4h paired future price, future-leakage refusal and missing grid
        run: |
          python -m py_compile auditor/btc_demand_v7/otc_signed_counterfactual_audit_v5.py
          python -m btc_demand_v7.test_otc_prospective_policy_v5
          python -m btc_demand_v7.test_otc_signed_counterfactual_audit_v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: btc-v7r5-otc-precommitted-policy-d233d93baa02ee2b184bddb02afbd06d46cd9dce
          path: /tmp/btc-otc-frozen-policy
          run-id: 38247653985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify exact PRE-outcome policy code blob and original OIDC/Rekor attestation
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git hash-object auditor/btc_demand_v7/otc_prospective_policy_v5.py)
          test "$ACTUAL" = "4b3302dd3c06a8c136c3ba12234aeecaddac960f"
          cosign verify-blob /tmp/btc-otc-frozen-policy/btc-v7r5-otc-precommitted-policy.json \
            --bundle /tmp/btc-otc-frozen-policy/btc-v7r5-otc-precommitted-policy.sigstore.json \
            --certificate-identity "https://github.com/sergeytren1984-ux/neora-b2b-v2-clean/.github/workflows/btc-v7r5-otc-policy-precommit.yml@refs/heads/btc-v7r5-otc-prospective-proxy-20261012" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path("/tmp/btc-otc-frozen-policy/btc-v7r5-otc-precommitted-policy.json")
          x=json.loads(p.read_text())
          assert x["policy_producer_sha"]=="d233d93baa02ee2b184bddb02afbd06d46cd9dce"
          assert datetime.datetime.fromisoformat(x["registered_before_future_epoch_utc"]) < datetime.datetime.fromisoformat(x["source_epoch_start"])
          b=json.loads(pathlib.Path("/tmp/btc-otc-frozen-policy/btc-v7r5-otc-precommitted-policy.sigstore.json").read_text())
          assert any(v.get("inclusionProof") for v in b["verificationMaterial"]["tlogEntries"])
          print("BTC_R5_IMMUTABLE_BEFORE_FORECAST_OTC_RULE_COSIGN_REKOR_VERIFIED")
          PY
      - name: Re-verify all due signed forecast, release delivery, raw 4h and outcome
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git -C signed-r5 rev-parse HEAD)
          python -m btc_demand_v7.otc_signed_counterfactual_audit_v5 \
            --ledger signed-r5 \
            --precommitted-policy /tmp/btc-otc-frozen-policy/btc-v7r5-otc-precommitted-policy.json \
            --evidence-head-sha "$SHA" \
            --out /tmp/btc-v7r5-real-4h-otc-shadow-scorecard.json
      - name: OIDC/Rekor sign even negative, inconclusive or empty-grid result
        run: |
          cosign sign-blob --yes \
            --bundle /tmp/btc-v7r5-real-4h-otc-shadow-scorecard.sigstore.json \
            /tmp/btc-v7r5-real-4h-otc-shadow-scorecard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc-v7r5-otc-prospective-economics-${{ github.run_id }}
          path: /tmp/btc-v7r5-real-4h-otc-shadow-scorecard*
          retention-days: 90
          if-no-files-found: error
