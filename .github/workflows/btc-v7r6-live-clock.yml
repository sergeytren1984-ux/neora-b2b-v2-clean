name: BTC v7R6 independent prospective paired shadow clock (no trading)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/btc-v7r6-live-clock.yml
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [slot, register]
        default: slot
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: btc-v7r6-independent-live-shadow
  cancel-in-progress: false

jobs:
  prospective-v7r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
      RUNNER_SOURCE_SHA: d9f259b852c85f60417ff2d24acc21c47ef83880
      PYTHONHASHSEED: '0'
    steps:
      - name: Pin research runner and original frozen R6 formula source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d9f259b852c85f60417ff2d24acc21c47ef83880
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Reject invalid sources, late records, state-reset attempts and mathematical drift
        run: |
          python -m btc_demand_v7.test_v7r6_live_pair_worker
          python -m btc_demand_v7.test_demand_change_v2
          python -m btc_demand_v7.test_episode_quality_v4
          python - <<'PY'
          from btc_demand_v7.v7r6_live_pair_worker import verify_runner
          print("BTC_V7R6_VERIFIED_PINNED_MATH_AND_SOURCE",verify_runner())
          PY
      - name: Sign immutable pre-epoch research grid (push/manual register only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'register')
        run: |
          python -m btc_demand_v7.v7r6_live_pair_worker register
      - name: Publish no-backdated future signed challenger before frozen deadline
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'slot')
        run: |
          python -m btc_demand_v7.v7r6_live_pair_worker slot
