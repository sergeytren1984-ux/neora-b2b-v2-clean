name: BTC v7R6 immutable research endpoint (main refuses execution)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pinned v7R6 observer only, never main"
        type: choice
        options: [slot, register]
        required: true

permissions:
  contents: read

jobs:
  refuse-main:
    runs-on: ubuntu-24.04
    steps:
      - name: Do not sign prospective evidence using mutable main branch
        run: |
          echo "Must dispatch --ref btc-v7r6-pinned-observer-20261012; never this main workflow" >&2
          exit 1
