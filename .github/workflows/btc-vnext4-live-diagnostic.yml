name: BTC vNext4 one-off live diagnostic

on:
  push:
    branches: [btc-predictive-vnext4-research-20261004]
    paths:
      - research_vnext4/run_live_diagnostic.py
      - .github/workflows/btc-vnext4-live-diagnostic.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4-research-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - name: Run exact frozen-model live diagnostic
        env:
          PYTHONPATH: .
        run: python research_vnext4/run_live_diagnostic.py
      - name: Commit live diagnostic
        run: |
          git config user.name 'btc-vnext4-live-diagnostic[bot]'
          git config user.email 'btc-vnext4-live-diagnostic[bot]@users.noreply.github.com'
          git add research_vnext4/live_diagnostic.json
          git commit -m "Record one-off live BTC diagnostic"
          git reset --hard HEAD
          git fetch origin btc-predictive-vnext4-research-20261004
          git rebase origin/btc-predictive-vnext4-research-20261004
          git push origin HEAD:btc-predictive-vnext4-research-20261004
