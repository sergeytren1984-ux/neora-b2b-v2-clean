name: BTC vNext4 operational barrier research

on:
  push:
    branches: [btc-predictive-vnext4-research-20261004]
    paths:
      - research_vnext4/run_operational_barrier.py
      - .github/workflows/btc-vnext4-operational-barrier-research.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-vnext4-operational-barrier-research
  cancel-in-progress: false

jobs:
  operational:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4-research-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scikit-learn==1.7.2 joblib==1.5.2
      - run: python research_vnext/fetch_hourly.py
      - name: Run generalized fixed-barrier model research
        env:
          PYTHONPATH: .
        run: python research_vnext4/run_operational_barrier.py
      - name: Commit operational research output
        run: |
          git config user.name 'btc-vnext4-operational-research[bot]'
          git config user.email 'btc-vnext4-operational-research[bot]@users.noreply.github.com'
          git add research_vnext4/operational_barrier_result.json
          git commit -m "Record generalized operational first-passage research"
          git reset --hard HEAD
          git fetch origin btc-predictive-vnext4-research-20261004
          git rebase origin/btc-predictive-vnext4-research-20261004
          git push origin HEAD:btc-predictive-vnext4-research-20261004
