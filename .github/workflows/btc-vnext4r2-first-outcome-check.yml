name: BTC vNext4R2 first outcome factual check

on:
  push:
    branches: [btc-predictive-vnext4-research-20261004]
    paths:
      - research_vnext4/check_first_r2_outcome.py
      - .github/workflows/btc-vnext4r2-first-outcome-check.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: btc-predictive-vnext4-research-20261004
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python research_vnext4/check_first_r2_outcome.py
      - name: Commit factual check
        run: |
          git config user.name 'btc-vnext4r2-factual-check[bot]'
          git config user.email 'btc-vnext4r2-factual-check[bot]@users.noreply.github.com'
          git add research_vnext4/first_r2_outcome_check.json
          git commit -m "Record factual first vNext4R2 outcome check"
          git reset --hard HEAD
          git fetch origin btc-predictive-vnext4-research-20261004
          git rebase origin/btc-predictive-vnext4-research-20261004
          git push origin HEAD:btc-predictive-vnext4-research-20261004
