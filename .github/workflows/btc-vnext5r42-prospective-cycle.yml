name: BTC vNext5R4.2 prospective cycle

on:
  schedule:
    - cron: '3,8,20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check dispatch plan without starting production actions'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: btc-vnext5r42-cycle
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Dispatch pinned prospective forecast/outcome jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          now=datetime.datetime.now(datetime.timezone.utc)
          start=datetime.datetime(2026,10,9,0,0,tzinfo=datetime.timezone.utc)
          approved_ref="btc-predictive-vnext5r42-trust-barrier-remediation-20261008"
          workflow="btc-predictive-vnext5r42-evidence.yml"
          repo=os.environ["GH_REPO"]
          dry_run=os.environ.get("DRY_RUN","false").lower()=="true"
          if now<start:
              print("PRESTART: no production dispatch",now.isoformat())
              raise SystemExit(0)
          minute=now.minute
          hour=now.hour
          if minute<=13:
              action="forecast"
              heads=["1h"]
              if hour%4==0: heads.append("4h")
              if hour==0: heads.append("24h")
          elif 15<=minute<=45:
              action="outcome"
              heads=["1h","4h","24h"]
          else:
              print("Outside dispatch interval",now.isoformat())
              raise SystemExit(0)
          # Non-hourly anchor heads are dispatched only on their UTC phase.
          # Outcome jobs inspect all due forecasts and are safe to retry.
          for head in heads:
              inputs=dict(action=action,head=head,
                  evidence_branch=f"btc-vnext5r42-prospective-20261009-{head}")
              print("dispatch",head,action,now.isoformat(), "dry_run",dry_run,flush=True)
              if dry_run: continue
              payload=json.dumps(dict(ref=approved_ref,inputs=inputs)).encode()
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches",
                  data=payload,method="POST",
                  headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept":"application/vnd.github+json",
                           "X-GitHub-Api-Version":"2022-11-28",
                           "Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=25) as res:
                  if res.status!=204: raise RuntimeError(f"dispatch HTTP {res.status}")
              print("DISPATCH_ACCEPTED",head,action,flush=True)
          PY
