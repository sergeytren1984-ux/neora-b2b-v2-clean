name: BTC vNext6 1m impulse and price skill audit (research only)

on:
  push:
    branches: [btc-predictive-vnext6-skill-rebuild-20261011]
    paths:
      - btc_skill_rebuild/evaluate_microstructure.py
      - .github/workflows/btc-vnext6-micro-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: btc-vnext6-minute-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact numerical runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scikit-learn==1.7.2 scipy==1.16.3 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - uses: actions/download-artifact@v4
        with:
          name: btc-vnext6-causal-skill-audit-81beeaf6d8c4d55452e28439b84fdf7af708f690
          path: /tmp/spot-rnd-audit
          run-id: 38166535215
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Verify base spot raw and compile minute audit
        run: |
          python -m py_compile btc_skill_rebuild/evaluate_microstructure.py
          python - <<'PY'
          import gzip,json,pathlib,hashlib
          p=pathlib.Path('/tmp/spot-rnd-audit')
          j=json.loads((p/'research_result.json').read_text())
          with gzip.open(p/'raw_5m_closed_klines.json.gz','rb') as f:
              if hashlib.sha256(f.read()).hexdigest()!=j['raw_sha256']:
                  raise ValueError("spot data SHA binding broken")
          print("SPOT_RAW_SOURCE_SHA_VERIFIED")
          PY
      - name: Causal identical-sample 1m and futures comparison
        run: |
          python -m btc_skill_rebuild.evaluate_microstructure \
            --spot-raw /tmp/spot-rnd-audit/raw_5m_closed_klines.json.gz \
            --futures-raw btc_skill_rebuild/raw/oi_funding_20260914_20261011.json.gz \
            --out /tmp/btc-vnext6-micro-audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign minute raw and evaluation outcome with OIDC Rekor
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle /tmp/btc-vnext6-micro-audit/micro_audit.sigstore.json \
            /tmp/btc-vnext6-micro-audit/micro_audit.json
          cosign sign-blob --yes \
            --bundle /tmp/btc-vnext6-micro-audit/raw_minute_klines.sigstore.json \
            /tmp/btc-vnext6-micro-audit/raw_minute_klines.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: btc-vnext6-minute-comparison-${{ github.sha }}
          path: /tmp/btc-vnext6-micro-audit/
          retention-days: 90
          if-no-files-found: error
