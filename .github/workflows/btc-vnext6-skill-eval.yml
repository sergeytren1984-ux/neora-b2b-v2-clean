name: BTC vNext6 numerical skill audit (research only)

on:
  push:
    branches: [btc-predictive-vnext6-skill-rebuild-20261011]
    paths:
      - btc_skill_rebuild/**
      - .github/workflows/btc-vnext6-skill-eval.yml
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: btc-vnext6-skill-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned research-only numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scikit-learn==1.7.2 scipy==1.16.3 \
            joblib==1.5.2 threadpoolctl==3.6.0
      - name: Reject syntactically invalid source and test index invariants
        run: |
          python -m py_compile btc_skill_rebuild/evaluate.py
          python -m btc_skill_rebuild.test_audit
      - name: Fetch closed 5m market data and evaluate chronologically
        run: |
          python btc_skill_rebuild/evaluate.py --out /tmp/btc-vnext6-audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign research artifacts with GitHub OIDC and Rekor
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle /tmp/btc-vnext6-audit/research_result.sigstore.json \
            /tmp/btc-vnext6-audit/research_result.json
          cosign sign-blob --yes \
            --bundle /tmp/btc-vnext6-audit/raw_5m_closed_klines.sigstore.json \
            /tmp/btc-vnext6-audit/raw_5m_closed_klines.json.gz
      - name: Upload full immutable research evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-vnext6-causal-skill-audit-${{ github.sha }}
          path: /tmp/btc-vnext6-audit/
          retention-days: 90
          if-no-files-found: error
